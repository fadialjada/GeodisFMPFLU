        const formatTime = (timeStr) => {
            if (!timeStr || timeStr === 'N/A') return 'N/A';
            const str = String(timeStr);
            const [hours, minutes] = str.split(':');
            if (!hours || !minutes) return str;
            const h = parseInt(hours, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const formattedH = h % 12 || 12;
            return `${formattedH}:${minutes} ${ampm}`;
        };

        const getWeekBoundaries = (dateStr) => {
            const d = new Date(dateStr + 'T12:00:00');
            const day = d.getDay();
            const diffToMonday = day === 0 ? -6 : 1 - day;
            const monday = new Date(d);
            monday.setDate(d.getDate() + diffToMonday);

            const days = [];
            const formattedDates = [];
            for (let i = 0; i < 7; i++) {
                const current = new Date(monday);
                current.setDate(monday.getDate() + i);
                days.push(current.toISOString().split('T')[0]);
                formattedDates.push(current.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
            }
            return { mondayStr: days[0], sundayStr: days[6], days, formattedDates };
        };

        const levenshteinDistance = (str1, str2) => {
            const a = (str1 || '').toLowerCase();
            const b = (str2 || '').toLowerCase();
            if (a === b) return 0;
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        };

        const isFuzzyMatch = (name1, name2) => {
            if (!name1 || !name2) return false;
            const a = name1.toLowerCase().trim();
            const b = name2.toLowerCase().trim();
            if (a === b) return true;
            
            const maxDist = Math.max(a.length, b.length) > 12 ? 2 : 1;
            if (Math.min(a.length, b.length) <= 3) return false;
            return levenshteinDistance(a, b) <= maxDist;
        };

                        timeZone: 'America/Chicago',
                        hour: 'numeric',
                        minute: 'numeric',
                        hour12: false
                    });
                    
                    const parts = formatter.formatToParts(now);

                    const minutePart = parts.find(p => p.type === 'minute')?.value;
                    
                    if (!hourPart || !minutePart) return;

            const calculateKPIs = (inputData) => {
                const d = inputData || DEFAULT_DATA;
                const routes = Number(d.loadout?.metrics?.[0]?.value) || 0;
                const orders = Number(d.loadout?.metrics?.[1]?.value) || 0;
                const pickups = Number(d.endOfDay?.risk?.[2]?.value) || 0;
                const basicCount = Number(d.loadout?.basicDeliveryCount) || 0;
                const thresholdCount = Number(d.loadout?.thresholdCount) || 0;
                const whiteGloveCount = Number(d.loadout?.whiteGloveCount) || 0;
                const uniform = Number(d.loadout?.uniformCount) || 0;
                const offDock = Number(d.loadout?.offDockCount) || 0;
                const eta = Number(d.loadout?.etaCount) || 0;
                const comp = Number(d.loadout?.completedRoutesCount) || 0;
                const missedDeliv = Number(d.midDay?.metrics?.[2]?.value) || 0;
                const earlyViolations = Number(d.midDay?.earlyCount) || 0;
                const missedEta = Math.max(0, routes - eta);
                const incompleteRoutes = Math.max(0, routes - comp);
                const onTimeOrders = Math.max(0, orders - (missedEta + missedDeliv + earlyViolations + incompleteRoutes));
                const otd = orders > 0 ? (onTimeOrders / orders) * 100 : 0;
                const offDockPerc = routes > 0 ? (offDock / routes) * 100 : 0;
                const etaPerc = routes > 0 ? (eta / routes) * 100 : 0;
                const compPerc = routes > 0 ? (comp / routes) * 100 : 0;
                const uniformPerc = routes > 0 ? (uniform / routes) * 100 : 0;
                const executionScore = (uniformPerc + offDockPerc + etaPerc + compPerc + otd) / 5;
                const transitDamages = Number(d.loadout?.transitDamage) || 0;
                const damageRate = orders > 0 ? (transitDamages / orders) * 100 : 0;
                const escalations = Number(d.loadout?.escalations) || 0;
                const escPerc = orders > 0 ? Math.max(0, ((orders - escalations) / orders) * 100) : 0;
                const pods = Number(d.loadout?.podsReconciled) || 0;
                const podPerc = orders > 0 ? Math.min(100, (pods / orders) * 100) : 0;
                const notHome = Number(d.loadout?.customerNotHome) || 0;
                const notHomePerc = orders > 0 ? (notHome / orders) * 100 : 0;
                const claims = Number(d.loadout?.claimsOpen) || 0;
                const claimsPerc = orders > 0 ? (claims / orders) * 100 : 0;

                const checkedInCount = (d.routeTable || []).filter(r => r.checkedIn).length;
                const checkedInPerc = routes > 0 ? (checkedInCount / routes) * 100 : 0;

                return { 
                    otd, executionScore, damageRate, offDockPerc, etaPerc, compPerc, uniformPerc, 
                    routes, orders, pickups, basicCount, thresholdCount, whiteGloveCount, missedDeliv, earlyViolations, escPerc, podPerc, notHomePerc, claimsPerc, checkedInCount, checkedInPerc 
                };
            };

                });
                const wtdAvg = (key) => {
                    if (!last7Days.length) return 0;
                    const sum = last7Days.reduce((acc, curr) => acc + calculateKPIs(curr)[key], 0);
                    return sum / last7Days.length;
                };
                return { 
                    yesterday: yesterdayKPI, 
                    wtd: { 
                        otd: wtdAvg('otd'), executionScore: wtdAvg('executionScore'), damageRate: wtdAvg('damageRate'), 
                        offDockPerc: wtdAvg('offDockPerc'), etaPerc: wtdAvg('etaPerc'), compPerc: wtdAvg('compPerc'),

                    for (let i = 0; i < fRows.length; i++) {
                        const rowText = fRows[i];

                        const possibleScore = cols[4] ? parseFloat(cols[4].replace(/[^0-9.-]/g, '')) : NaN;
                        const hasOrderNum = cols[5] && cols[5].includes('SO-');

                        if (cols.length >= 5 && (!isNaN(possibleScore) || hasOrderNum)) {
                            if (currentFeedback) fParsedData.push(currentFeedback);
                            
                            currentFeedback = {
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5) + i,

                                comment: (cols.slice(6).join('\t') || '').replace(/^"|"$/g, '').trim()
                            };
                        } else if (currentFeedback && rowText.trim() !== '') {
                            currentFeedback.comment += (currentFeedback.comment ? '\n' : '') + rowText.trim().replace(/^"|"$/g, '');
                        }
                    }
                    if (currentFeedback) fParsedData.push(currentFeedback);

                    if (e.target) e.target.value = "";

                    if (fParsedData.length > 0) {
                        const nd = JSON.parse(JSON.stringify(data));
                        if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                        if (!nd.metricsTracker.feedback) nd.metricsTracker.feedback = [];
                        nd.metricsTracker.feedback = [...nd.metricsTracker.feedback, ...fParsedData];
                        setData(nd);
                        setPasteFeedback(`✅ Successfully extracted ${fParsedData.length} feedback reviews!`);
                    } else {
                        setPasteFeedback(`❌ Could not detect feedback data.`);
                    }
                    setTimeout(() => setPasteFeedback(''), 5000);
                    return; 
                }

                const mRows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r);
                const mParsedData = [];
                let foundTotals = null;

                for (const row of mRows) {
                    const cols = row.split('\t').map(c => c.trim());
                    const rawStr = row.toLowerCase();
                    
                    if (rawStr.includes('minimum target') || rawStr.includes('driverkey') || rawStr.includes('max. driver')) {
                        continue;
                    }

                    const nums = cols.map(c => c.replace(/[^0-9.-]/g, '')).filter(c => c !== '').map(Number);
                    if (rawStr.includes('grand total') || rawStr.includes('total') || (cols[0] === '' && cols[1] === '' && nums.length >= 4)) {
                        if (nums.length >= 4) {
                            foundTotals = {

                                onTime: nums[nums.length - 3] || 0,
                                completion: nums[nums.length - 2] || 0,
                                exchange: nums[nums.length - 1] || 0
                            };
                        }
                        continue;
                    }

                    if (cols.length < 4) continue;

                    let offset = /^\d+/.test(cols[0]) ? 0 : -1;
                    const parseNum = (val) => parseFloat((val || '').replace(/[^0-9.-]/g, '')) || 0;

                    const firstName = cols[1 + offset] || '';
                    const lastName = cols[2 + offset] || '';
                    if (!firstName && !lastName) continue;

                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        firstName: firstName,
                        lastName: lastName,
                        surveyCnt: parseInt(parseNum(cols[3 + offset]), 10) || 0,
                        surveyAvg: parseNum(cols[4 + offset]),
                        onTime: parseNum(cols[5 + offset]),
                        completion: parseNum(cols[6 + offset]),
                        exchange: parseNum(cols[7 + offset])
                    });

                if (!metricsList || metricsList.length === 0) return null;

                let validOnTime = 0, validComp = 0, validExch = 0;
                
                metricsList.forEach(m => { 
                    const cnt = m.surveyCnt || 0;
                    totalCnt += cnt; 
                    sumAvgWeight += (m.surveyAvg || 0) * cnt; 
                    
                    if (m.onTime !== undefined && m.onTime > 0) { sumOnTime += m.onTime; validOnTime++; }
                    if (m.completion !== undefined && m.completion > 0) { sumCompletion += m.completion; validComp++; }
                    if (m.exchange !== undefined) { sumExchange += m.exchange; validExch++; }
                });
                
                const driverCount = metricsList.length;
                if (driverCount === 0) return null;
                
                return {

                    surveyAvg: totalCnt > 0 ? (sumAvgWeight / totalCnt).toFixed(2) : "0.00", 
                    onTime: validOnTime > 0 ? (sumOnTime / validOnTime).toFixed(2) : "0.00",

                            return 'bg-rose-900/40 text-rose-400';
                        }
                    } else {
                        const target = isTotal ? 800 : 40;
                        if (num >= target * 0.8) return 'bg-emerald-900/40 text-emerald-400';
                        if (num >= target * 0.5) return 'bg-amber-900/40 text-amber-400';
                        return 'bg-rose-900/40 text-rose-400';
                    }
                }
                if (key === 'surveyAvg') return num >= 9.65 ? 'bg-emerald-900/40 text-emerald-400' : 'bg-rose-900/40 text-rose-400';
                if (key === 'onTime') {
                    if (num >= 97.50) return 'bg-emerald-900/40 text-emerald-400';
                    if (num >= 94.00) return 'bg-amber-900/40 text-amber-400';
                    return 'bg-rose-900/40 text-rose-400';
                }
                if (key === 'completion') {
                    if (num >= 98.05) return 'bg-emerald-900/40 text-emerald-400';
                    if (num >= 96.00) return 'bg-amber-900/40 text-amber-400';
                    return 'bg-rose-900/40 text-rose-400';
                }
                if (key === 'exchange') {
                    if (num <= 1.70) return 'bg-emerald-900/40 text-emerald-400';
                    if (num <= 3.00) return 'bg-amber-900/40 text-amber-400';
                    return 'bg-rose-900/40 text-rose-400';
                }
                return '';
            };

            const exportMetricsToCSV = () => {
                if (metricsSubTab === 'feedback') {
                    const currentFeedback = data.metricsTracker?.feedback;
                    if (!currentFeedback || currentFeedback.length === 0) return;
                    const headers = ["Date", "First Name", "Last Name", "Delivery Type", "Score", "Order Number", "Comment"];
                    const rows = currentFeedback.map(row => [
                        `"${row.date || ''}"`, `"${row.firstName || ''}"`, `"${row.lastName || ''}"`, `"${row.type || ''}"`,
                        row.score, `"${row.orderNum || ''}"`, `"${(row.comment || '').replace(/"/g, '""')}"`
                    ].join(","));
                    
                    const csvContent = [headers.join(","), ...rows].join("\n");
                    const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `Geodis_Feedback_${activeDate}.csv`);
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    return;
                }

                const currentMetrics = data.metricsTracker?.[metricsSubTab];
                if (!currentMetrics || currentMetrics.length === 0) return;
                const headers = ["First Name", "Last Name", "Survey Count", "Survey AVG", "OnTime%", "Completion %", "Exchange % ($)"];
                const rows = currentMetrics.map(row => [
                    `"${row.firstName || ''}"`, `"${row.lastName || ''}"`, row.surveyCnt, row.surveyAvg, `"${row.onTime}%"`, `"${row.completion}%"`, `"${row.exchange}%"`
                ].join(","));

                const totals = data.metricsTracker?.[`${metricsSubTab}Totals`] || calculateMetricsTotals(currentMetrics);
                if (totals) {
                    rows.push(['"Grand Total"', '""', totals.surveyCnt, totals.surveyAvg, `"${totals.onTime}%"`, `"${totals.completion}%"`, `"${totals.exchange}%"`].join(","));
                }
                
                const csvContent = [headers.join(","), ...rows].join("\n");
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Geodis_Metrics_${metricsSubTab.toUpperCase()}_${activeDate}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const filteredHistoryData = historyData.filter(h => {
                if (historyDateFrom && h.date < historyDateFrom) return false;
                if (historyDateTo && h.date > historyDateTo) return false;
                return true;
            });

            const exportHistoryMetricsToCSV = () => {
                if (filteredHistoryData.length === 0) return;

                if (historyMetricsSubTab === 'feedback') {
                    const rows = [];
                    filteredHistoryData.forEach(h => {
                        if (h.metricsTracker?.feedback && h.metricsTracker.feedback.length > 0) {
                            h.metricsTracker.feedback.forEach(row => {
                                rows.push([
                                    `"${h.date}"`, `"${row.date || ''}"`, `"${row.firstName || ''}"`, `"${row.lastName || ''}"`,
                                    `"${row.type || ''}"`, row.score, `"${row.orderNum || ''}"`, `"${(row.comment || '').replace(/"/g, '""')}"`
                                ].join(","));
                            });
                        }
                    });
                    if (rows.length === 0) return;
                    const headers = ["Recap Date", "Feedback Date", "First Name", "Last Name", "Delivery Type", "Score", "Order Number", "Comment"];
                    
                    const csvContent = [headers.join(","), ...rows].join("\n");
                    const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.setAttribute("href", url);
                    link.setAttribute("download", `Geodis_Historical_Feedback_${new Date().toISOString().split('T')[0]}.csv`);
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    return;
                }

                const rows = [];
                filteredHistoryData.forEach(h => {
                    const currentMetrics = h.metricsTracker?.[historyMetricsSubTab];
                    if (currentMetrics && currentMetrics.length > 0) {
                        currentMetrics.forEach(row => {
                            rows.push([
                                `"${h.date}"`, `"${row.firstName || ''}"`, `"${row.lastName || ''}"`,
                                row.surveyCnt, row.surveyAvg, `"${row.onTime}%"`, `"${row.completion}%"`, `"${row.exchange}%"`
                            ].join(","));
                        });
                    }
                });
                
                if (rows.length === 0) return;
                
                const headers = ["Recap Date", "First Name", "Last Name", "Survey Count", "Survey AVG", "OnTime%", "Completion %", "Exchange % ($)"];
                
                const csvContent = [headers.join(","), ...rows].join("\n");
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Geodis_Historical_${historyMetricsSubTab.toUpperCase()}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const exportRoutesToCSV = () => {
                if (!data.routeTable || data.routeTable.length === 0) return;
                const headers = ROUTE_COLUMNS.map(col => `"${col.label}"`);
                const rows = data.routeTable.map(row => {
                    return ROUTE_COLUMNS.map(col => {
                        let val = row[col.key];
                        if (col.type === 'checkbox') { val = val ? 'Yes' : 'No'; } 
                        else if (col.type === 'custom_uniform') { val = row.uniform ? 'Yes' : (row.uniformNote || 'No'); }
                        else if (col.type === 'time' && val) { val = formatTime(val); }
                        const escapedVal = String(val || '').replace(/"/g, '""');
                        return `"${escapedVal}"`;
                    }).join(",");
                });
                
                const csvContent = [headers.join(","), ...rows].join("\n");
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `Geodis_Routes_${activeDate}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            const exportHistoryRoutesToCSV = () => {
                if (filteredHistoryData.length === 0) return;
                
                let hasRoutes = false;
                const headers = ['"Date"', ...ROUTE_COLUMNS.map(col => `"${col.label}"`)];
                const rows = [];
                
                filteredHistoryData.forEach(h => {
                    if (h.routeTable && h.routeTable.length > 0) {

                        h.routeTable.forEach(row => {
                            const rowData = [ `"${h.date}"` ];
                            ROUTE_COLUMNS.forEach(col => {
                                let val = row[col.key];
                                if (col.type === 'checkbox') { val = val ? 'Yes' : 'No'; } 
                                else if (col.type === 'custom_uniform') { val = row.uniform ? 'Yes' : (row.uniformNote || 'No'); }
                                else if (col.type === 'time' && val) { val = formatTime(val); }
                                const escapedVal = String(val || '').replace(/"/g, '""');
                                rowData.push(`"${escapedVal}"`);
                            });
                            rows.push(rowData.join(","));
                        });
                    }
                });

                if (!hasRoutes) return;

                const csvContent = [headers.join(","), ...rows].join("\n");
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                
                let fileName = `Geodis_Historical_Routes_${new Date().toISOString().split('T')[0]}.csv`;
                if (historyDateFrom && historyDateTo) fileName = `Geodis_Historical_Routes_${historyDateFrom}_to_${historyDateTo}.csv`;
                else if (historyDateFrom) fileName = `Geodis_Historical_Routes_From_${historyDateFrom}.csv`;
                else if (historyDateTo) fileName = `Geodis_Historical_Routes_Until_${historyDateTo}.csv`;

                link.setAttribute("download", fileName);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

                setTimeout(async () => {
                    try {
                        const element = dashboardRef.current;
                        const canvas = await window.html2canvas(element, { 
                            backgroundColor: '#0f172a', scale: 2, useCORS: true, logging: false, allowTaint: true, scrollY: 0, scrollX: 0,
                            windowWidth: element.scrollWidth, windowHeight: element.scrollHeight,
                            onclone: (clonedDoc) => {
                                const header = clonedDoc.querySelector('header');
                                const footer = clonedDoc.querySelector('footer');
                                if (header) { header.style.display = 'none'; }
                                if (footer) { footer.style.display = 'none'; }
                                const dateInput = clonedDoc.querySelector('input[type="date"]');
                                if (dateInput) {
                                    const val = dateInput.value;
                                    const displaySpan = clonedDoc.createElement('span');
                                    displaySpan.innerText = val || 'N/A';
                                    displaySpan.className = dateInput.className;
                                    dateInput.parentNode.replaceChild(displaySpan, dateInput);
                                }
                            }
                        });
                        const link = document.createElement("a");
                        link.download = `Geodis-Recap-${activeDate}.png`;
                        link.href = canvas.toDataURL("image/png", 1.0);
                        link.click();
                    } catch (err) { } finally { 
                        window.scrollTo(0, scrollPos);
                        setIsCapturing(false); 
                    }
                }, 600); 
            };

            const displayDateString = new Date(activeDate + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const nextDayString = new Date(new Date(activeDate + 'T12:00:00').getTime() + 86400000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            const toFixedSafe = (val, dec = 1) => { const num = Number(val); return isNaN(num) ? '0.0' : num.toFixed(dec); };

            const TrendIndicator = ({ current, previous, inverse = false, isPercent = true }) => {
                const curr = Number(current) || 0;
                const prev = Number(previous) || 0;
                const diff = curr - prev;
                if (prev === 0 || Math.abs(diff) < 0.01) return <span className="text-[11px] font-bold text-slate-500 flex items-center gap-1"><Minus className="w-3 h-3"/> 0{isPercent ? '%' : ''}</span>;
                const isBetter = inverse ? diff < 0 : diff > 0;
                return <span className={`text-[11px] font-bold ${isBetter ? 'text-emerald-400' : 'text-rose-400'} flex items-center gap-1`}><ArrowUp className={`w-3 h-3 ${diff < 0 ? 'rotate-180' : ''}`} /> {toFixedSafe(Math.abs(diff))}{isPercent ? '%' : ''}</span>;
            };

            const StatusBadge = ({ status, onClick, isEditing }) => (
                <button disabled={!isEditing} onClick={onClick} className={`px-3 py-1 rounded-full text-[10px] font-bold flex items-center gap-1.5 transition-all ${status ? "bg-emerald-900/40 text-emerald-400 border border-emerald-500/30" : "bg-amber-900/40 text-amber-400 border border-amber-500/30"} ${isEditing ? "hover:scale-105 cursor-pointer ring-2 ring-transparent hover:ring-indigo-500/50" : ""}`}>
                    {status ? <CheckCircle2 className="w-3 h-3" /> : <Info className="w-3 h-3" />} {status ? "COMPLIANT" : "PENDING"}
                </button>
            );

            return (
                <div ref={dashboardRef} className="relative min-h-screen bg-slate-900 font-sans text-slate-100 pb-20 overflow-x-hidden">
                    <header data-html2canvas-ignore="true" className={`bg-slate-800 border-b border-slate-700 relative z-30 shadow-lg ${isCapturing ? 'hidden' : 'sticky top-0'}`}>
                        <div className="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
                            <div className="flex items-center gap-4">
                                <div className="bg-indigo-600 p-2 rounded-lg shadow-lg"><LayoutDashboard className="w-6 h-6 text-white" /></div>

                                <nav className="ml-6 flex items-center bg-slate-900/50 p-1 rounded-xl border border-slate-700">
                                    <button onClick={() => setActiveTab('overview')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'overview' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}>OVERVIEW</button>
                                    <button onClick={() => setActiveTab('routes')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === 'routes' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}><Route className="w-3.5 h-3.5" /> ROUTES</button>
                                    <button onClick={() => setActiveTab('metrics')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === 'metrics' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}><Activity className="w-3.5 h-3.5" /> METRICS</button>
                                    <button onClick={() => setActiveTab('history')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'history' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}>HISTORY</button>
                                    <button onClick={() => setActiveTab('notes')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all ${activeTab === 'notes' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}>SHIFT NOTES</button>
                                    <button onClick={() => setActiveTab('bonus')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${activeTab === 'bonus' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white cursor-pointer'}`}><Award className="w-3.5 h-3.5" /> BONUS</button>
                                </nav>

                                <button onClick={handleShare} className="p-2.5 rounded-xl bg-slate-700 border border-slate-600 text-emerald-400 hover:bg-slate-600 transition-all active:scale-95 cursor-pointer" title="Share Link">
                                    {shareCopied ? <Check className="w-4 h-4 text-emerald-400" /> : <Share2 className="w-4 h-4" />}
                                </button>
                                <button onClick={handleDownloadScreenshot} className="p-2.5 rounded-xl bg-slate-700 border border-slate-600 text-sky-400 hover:bg-slate-600 transition-all active:scale-95 cursor-pointer" title="Download Screenshot">
                                    <Camera className="w-4 h-4" />
                                </button>
                                <button onClick={() => isEditing ? handleSave() : setIsEditing(true)} className={`flex items-center gap-2 px-4 py-2 rounded-lg font-bold text-sm transition-all cursor-pointer ${isEditing ? "bg-emerald-600 shadow-emerald-900/40" : "bg-slate-800 border border-slate-700 hover:bg-slate-700"}`}>
                                    {isEditing ? <><Save className="w-4 h-4" /> Save</> : <><Edit3 className="w-4 h-4" /> Edit</>}

                                    <Calendar className="w-4 h-4" />
                                    <input type="date" value={activeDate} onChange={(e) => setActiveDate(e.target.value)} className="bg-transparent outline-none w-28 cursor-pointer" />
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 py-8">
                        {isLoading ? (
                            <div className="h-[50vh] flex flex-col items-center justify-center text-slate-500">

                                <p className="font-bold uppercase text-[10px]">Syncing Logistics Database...</p>

                        ) : activeTab === 'overview' ? (
                            
                            <div className="animate-in fade-in duration-500">

                                        <div className="text-[9px] opacity-80 flex items-center gap-2">

                                            <span className="text-indigo-300 font-black">{String(data.lastUpdatedBy || 'System')}</span>
                                            <span className="text-slate-500">@ {new Date(data.lastUpdatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                        </div>

                                </div>

                                {data.shiftNotes?.some(n => n?.category === 'URGENT') && (
                                    <div className="mb-6 space-y-3">
                                        {data.shiftNotes.filter(n => n?.category === 'URGENT').map(note => (
                                            <div key={note.id} className="relative overflow-hidden bg-rose-950/40 border border-rose-500/50 rounded-xl p-4 shadow-[0_0_20px_rgba(225,29,72,0.15)] animate-in slide-in-from-top-2 flex gap-4 items-start">
                                                <div className="bg-rose-500/20 p-2 rounded-lg text-rose-400 animate-pulse">
                                                    <AlertTriangle className="w-6 h-6" />

                                                <div className="flex-1">
                                                    <h3 className="text-rose-400 font-black tracking-widest text-xs uppercase mb-1 flex items-center gap-2">
                                                        High Priority Alert
                                                        <span className="relative flex h-2 w-2">
                                                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                                                            <span className="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                                                        </span>
                                                    </h3>
                                                    <p className="text-rose-100 text-sm font-medium whitespace-pre-wrap">{note.text}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                
                                <section className="mb-10">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

                                            <span className="text-slate-400 text-[11px] font-bold uppercase tracking-widest block mb-1 relative z-10">Number of Routes</span>
                                            {isEditing ? (
                                                <input className="bg-slate-900 border border-slate-700 rounded px-2 text-xl font-bold w-full focus:ring-1 focus:ring-indigo-500 outline-none text-white relative z-10" value={String(data.loadout?.metrics?.[0]?.value || '0')} onChange={(e) => handleMetricChange('loadout', 0, e.target.value)} />
                                            ) : (
                                                <div className="flex items-baseline gap-3 relative z-10">
                                                    <div className="text-3xl font-black text-white">{String(data.loadout?.metrics?.[0]?.value || '0')}</div>
                                                    <TrendIndicator current={Number(data.loadout?.metrics?.[0]?.value || '0')} previous={trends.yesterday.routes} isPercent={false} />
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md relative overflow-hidden group transition-all">
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-5 group-hover:opacity-10 transition-opacity pointer-events-none text-slate-100"><Package className="w-24 h-24" /></div>
                                            <div className="relative z-10">
                                                <span className="text-slate-400 text-[11px] font-bold uppercase tracking-widest block mb-1">Number of Same Day Routes</span>

                                                        value={String(data.loadout?.metrics?.[1]?.value || '0')} 
                                                        onChange={(e) => handleMetricChange('loadout', 1, e.target.value)} 
                                                    />

                                                        <div className="text-3xl font-black text-white">{String(data.loadout?.metrics?.[1]?.value || '0')}</div>

                                        {[
                                            { label: "Teams in Uniform", count: String(data.loadout?.uniformCount || "0"), total: currentKPI.routes, perc: currentKPI.uniformPerc, key: 'uniformCount', section: 'loadout', target: '100%', prev: trends.yesterday.uniformPerc },
                                            { label: "Routes Dispatched by 7 AM", count: String(data.loadout?.offDockCount || "0"), total: currentKPI.routes, perc: currentKPI.offDockPerc, key: 'offDockCount', section: 'loadout', target: '100%', prev: trends.yesterday.offDockPerc },
                                            { label: "Early Delivery Violation", count: String(data.midDay?.earlyCount || "0"), total: currentKPI.orders, perc: currentKPI.earlyViolations, key: 'earlyCount', section: 'midDay', isException: true, target: '0', prev: trends.yesterday.earlyViolations, inverse: true }

                                                else if (count === 1) { textColor = 'text-amber-400'; barColor = 'bg-amber-500'; }
                                                else { textColor = 'text-rose-400'; barColor = 'bg-rose-500'; }
                                            } else {
                                                displayValue = `${toFixedSafe(item.perc)}%`;
                                                textColor = item.perc === 100 ? 'text-emerald-400' : 'text-amber-400';

                                            return (

                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-indigo-300 text-center bg-slate-900 border-b border-slate-700 shadow-inner">OnTime% ($)</th>
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-indigo-300 text-center bg-slate-900 border-b border-slate-700 shadow-inner">Completion % ($)</th>
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-emerald-400 text-center bg-slate-900 border-b border-l border-slate-700 shadow-inner">Total</th>
                                                    {isEditing && <th className="px-4 py-3 text-[10px] font-black uppercase text-slate-400 text-center bg-slate-900 border-b border-l border-slate-700 shadow-inner">Action</th>}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700/50">
                                                {(!data.metricsTracker || !data.metricsTracker.wtd || data.metricsTracker.wtd.length === 0) ? (
                                                    <tr>
                                                        <td colSpan={isEditing ? "11" : "10"} className="py-12 text-center text-slate-500 text-sm font-bold uppercase tracking-widest italic bg-slate-800">
                                                            Please paste WTD metrics in the METRICS tab to generate the Bonus Grid.
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    data.metricsTracker.wtd.map((row, idx) => {
                                                        const cnt = row.surveyCnt || 0;
                                                        const avg = row.surveyAvg || 0;
                                                        const onTime = row.onTime || 0;
                                                        const comp = row.completion || 0;

                                                        let dailyRate = 0;
                                                        let avgRate = 0, onTimeRate = 0, compRate = 0;

                                                        if (avg >= 9.65) {
                                                            avgRate = 20;
                                                            dailyRate += 20;
                                                            if (onTime >= 97.50) {
                                                                onTimeRate = 10;
                                                                dailyRate += 10;
                                                                if (comp >= 98.05) {
                                                                    compRate = 10;
                                                                    dailyRate += 10;
                                                                }
                                                            }
                                                        }

                                                        const isRowEditing = editingWtdIdx === idx && isEditing;

                                                        return (
                                                            <tr key={idx} className="hover:bg-slate-700/30 transition-colors">
                                                                {isRowEditing ? (
                                                                    <>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-2 py-1 text-xs text-white outline-none" value={row.firstName || ''} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].firstName = e.target.value; setData(nd); }} /></td>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-2 py-1 text-xs text-white outline-none" value={row.lastName || ''} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].lastName = e.target.value; setData(nd); }} /></td>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="number" className="w-14 mx-auto block bg-slate-950 border border-indigo-500/50 rounded px-1 py-1 text-xs text-center text-white outline-none" value={cnt} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].surveyCnt = parseInt(e.target.value) || 0; setData(nd); }} /></td>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="number" step="0.01" className="w-16 mx-auto block bg-slate-950 border border-indigo-500/50 rounded px-1 py-1 text-xs text-center text-white outline-none" value={avg} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].surveyAvg = parseFloat(e.target.value) || 0; setData(nd); }} /></td>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="number" step="0.01" className="w-16 mx-auto block bg-slate-950 border border-indigo-500/50 rounded px-1 py-1 text-xs text-center text-white outline-none" value={onTime} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].onTime = parseFloat(e.target.value) || 0; setData(nd); }} /></td>
                                                                        <td className="px-2 py-2 border-r border-slate-700"><input type="number" step="0.01" className="w-16 mx-auto block bg-slate-950 border border-indigo-500/50 rounded px-1 py-1 text-xs text-center text-white outline-none" value={comp} onChange={(e) => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd[idx].completion = parseFloat(e.target.value) || 0; setData(nd); }} /></td>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <td className="px-4 py-2 text-xs font-bold text-slate-200 border-r border-slate-700">{row.firstName}</td>

                                                                        <td className={`px-4 py-2 text-xs font-bold text-center border-r border-slate-700 ${getMetricColor('surveyCnt', cnt, 'wtd')}`}>{cnt}</td>
                                                                        <td className={`px-4 py-2 text-xs font-bold text-center border-r border-slate-700 ${getMetricColor('surveyAvg', avg, 'wtd')}`}>{avg.toFixed(2)}</td>
