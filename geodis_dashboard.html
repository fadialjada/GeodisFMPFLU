                                                                        <td className={`px-4 py-2 text-xs font-bold text-center border-r border-slate-700 ${getMetricColor('completion', comp, 'wtd')}`}>{comp.toFixed(2)}%</td>
                                                                    </>
                                                                )}
                                                                
                                                                <td className="px-4 py-2 text-xs font-black text-center text-slate-300 bg-slate-900/30">${avgRate}</td>
                                                                <td className="px-4 py-2 text-xs font-black text-center text-slate-300 bg-slate-900/30">${onTimeRate}</td>
                                                                <td className="px-4 py-2 text-xs font-black text-center text-slate-300 bg-slate-900/30">${compRate}</td>
                                                                <td className="px-4 py-2 text-xs font-black text-center text-emerald-400 bg-slate-900/50 border-l border-slate-700">${dailyRate}</td>
                                                                
                                                                {isEditing && (
                                                                    <td className="px-4 py-2 text-center border-l border-slate-700">
                                                                        <div className="flex items-center justify-center gap-1.5">
                                                                            {isRowEditing ? (
                                                                                <button onClick={() => setEditingWtdIdx(null)} className="p-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded transition-colors shadow-lg cursor-pointer" title="Save">
                                                                                    <Check className="w-3.5 h-3.5" />
                                                                                </button>
                                                                            ) : (
                                                                                <button onClick={() => setEditingWtdIdx(idx)} className="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/30 rounded transition-colors cursor-pointer" title="Edit">
                                                                                    <Edit3 className="w-3.5 h-3.5" />
                                                                                </button>
                                                                            )}
                                                                            <button onClick={() => { const nd = JSON.parse(JSON.stringify(data)); nd.metricsTracker.wtd = nd.metricsTracker.wtd.filter((_, i) => i !== idx); setData(nd); }} className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded transition-colors cursor-pointer" title="Delete">
                                                                                <Trash2 className="w-3.5 h-3.5" />
                                                                            </button>
                                                                        </div>
                                                                    </td>
                                                                )}
                                                            </tr>
                                                        );
                                                    })
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-2xl relative">
                                    <div className="px-4 py-3 bg-slate-900/80 border-b border-slate-700 text-xs font-black uppercase text-indigo-300 tracking-widest flex items-center justify-between">
                                        <div className="flex items-center gap-2"><Calendar className="w-4 h-4" /> Daily Bonus Payout Tracker</div>
                                        {isEditing && <span className="text-[10px] text-slate-400 italic font-medium lowercase">type amount, "off", or violation ("socks", "belt")</span>}
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse whitespace-nowrap min-w-[1200px]">
                                            <thead>
                                                <tr className="bg-slate-900/50 border-b border-slate-700">
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-slate-400 border-r border-slate-700">First Name</th>
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-slate-400 border-r border-slate-700">Last Name</th>
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-indigo-300 text-center border-r border-slate-700 shadow-inner bg-slate-900">10 Survey Count</th>
                                                    {getBonusWeekBoundaries(activeDate).formattedDates.map((dateStr, idx) => (
                                                        <th key={idx} className="px-4 py-3 text-[10px] font-black uppercase text-slate-400 text-center border-r border-slate-700">
                                                            {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][idx]}<br/><span className="text-slate-500">{dateStr}</span>
                                                        </th>
                                                    ))}
                                                    <th className="px-4 py-3 text-[10px] font-black uppercase text-emerald-400 text-center bg-slate-900 shadow-inner border-l border-slate-700">Total</th>
                                                    {isEditing && <th className="px-4 py-3 text-[10px] font-black uppercase text-slate-400 text-center bg-slate-900 shadow-inner border-l border-slate-700">Edit / Delete</th>}
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-700/50">
                                                {(() => {
                                                    const bonusBoundaries = getBonusWeekBoundaries(activeDate);
                                                    const wtdList = data.metricsTracker?.wtd || [];
                                                    
                                                    const allWeekPeople = new Set();
                                                    const weekRoutesByDay = {};

                                                    [0, 1, 2, 3, 4, 5, 6].forEach(dayIdx => {
                                                        const dateObj = new Date(bonusBoundaries.mondayStr + 'T12:00:00');
                                                        dateObj.setDate(dateObj.getDate() + dayIdx);
                                                        const dateStr = dateObj.toISOString().split('T')[0];
                                                        
                                                        const recapForDay = dateStr === activeDate ? data : historyData.find(h => h.date === dateStr);
                                                        const routes = recapForDay?.routeTable || [];
                                                        weekRoutesByDay[dayIdx] = routes;
                                                        
                                                        routes.forEach(r => {
                                                            if (r.driver) allWeekPeople.add(r.driver.trim());
                                                            if (r.helper) allWeekPeople.add(r.helper.trim());
                                                        });
                                                    });
                                                    
                                                    const driversMap = {};
                                                    wtdList.forEach(m => {
                                                        const key = `${m.firstName || ''} ${m.lastName || ''}`.trim();
                                                        if (key) driversMap[key] = { ...m };
                                                    });
                                                    
                                                    allWeekPeople.forEach(person => {
                                                        if (!person) return;
                                                        const existingKey = Object.keys(driversMap).find(k => isFuzzyMatch(k, person));
                                                        
                                                        if (!existingKey) {
                                                            const mappedKey = Object.keys(bonusData.nameMappings || {}).find(m => isFuzzyMatch(m, person));
                                                            const actualKeyToUse = mappedKey ? bonusData.nameMappings[mappedKey] : person;

                                                            const parts = actualKeyToUse.split(' ');
                                                            if (!driversMap[actualKeyToUse]) {
                                                                driversMap[actualKeyToUse] = { firstName: parts[0], lastName: parts.slice(1).join(' '), surveyCnt: 0, surveyAvg: 0, onTime: 0, completion: 0 };
                                                            }
                                                        }
                                                    });

                                                    (bonusData.manualDrivers || []).forEach(md => {
                                                        const key = `${md.firstName || ''} ${md.lastName || ''}`.trim();
                                                        if (key && !driversMap[key]) {
                                                            driversMap[key] = { firstName: md.firstName, lastName: md.lastName, surveyCnt: 0, surveyAvg: 0, onTime: 0, completion: 0 };
                                                        }
                                                    });

                                                    const finalDriverList = Object.values(driversMap)
                                                        .sort((a, b) => (a.firstName || '').localeCompare(b.firstName || ''))
                                                        .filter(driver => {
                                                            const key = `${driver.firstName || ''} ${driver.lastName || ''}`.trim();
                                                            return !(bonusData.hiddenDrivers || []).includes(key);
                                                        });

                                                    if (finalDriverList.length === 0) {
                                                        return <tr><td colSpan={isEditing ? "12" : "11"} className="py-12 text-center text-slate-500 text-sm font-bold uppercase tracking-widest italic">Awaiting Metrics and Route Data</td></tr>;
                                                    }

                                                    return finalDriverList.map((driver, idx) => {
                                                        const rawDriverKey = `${driver.firstName || ''} ${driver.lastName || ''}`.trim();
                                                        const driverKey = (bonusData.nameMappings || {})[rawDriverKey] || rawDriverKey;
                                                        
                                                        const surveyBonus = (driver.surveyCnt || 0) >= 10 ? 20 : 0;
                                                        
                                                        let dailyRate = 0;
                                                        if ((driver.surveyAvg || 0) >= 9.65) {
                                                            dailyRate += 20;
                                                            if ((driver.onTime || 0) >= 97.50) {
                                                                dailyRate += 10;
                                                                if ((driver.completion || 0) >= 98.05) {
                                                                    dailyRate += 10;
                                                                }
                                                            }
                                                        }

                                                        let rowTotal = surveyBonus;
                                                        const driverDays = bonusData.drivers?.[driverKey] || {};
                                                        const isEditingThisDriver = editingBonusDriver === driverKey && isEditing;
                                                        
                                                        const evaluatedDays = [0, 1, 2, 3, 4, 5, 6].map(dayIdx => {
                                                            const routes = weekRoutesByDay[dayIdx];
                                                            const driverRoutes = routes.filter(r => {
                                                                return isFuzzyMatch(r.driver, driverKey) || isFuzzyMatch(r.helper, driverKey);
                                                            });

                                                            let autoStatus = "Eligible";
                                                            const dayHasAnyRoutes = routes.length > 0;
                                                            
                                                            if (!dayHasAnyRoutes) {
                                                                    autoStatus = "Pending";
                                                            } else if (driverRoutes.length === 0) {
                                                                    autoStatus = "Off";
                                                            } else if (driverRoutes.some(r => r.uniform === false)) {
                                                                    autoStatus = "Uniform Violation";
                                                            }

                                                            const manualVal = driverDays[dayIdx];
                                                            let defaultStr = '-';
                                                            
                                                            if (autoStatus === "Off") {
                                                                defaultStr = "Off";
                                                            } else if (autoStatus === "Uniform Violation") {
                                                                defaultStr = "Uniform Violation";
                                                            } else if (autoStatus === "Eligible" && dailyRate > 0) {
                                                                defaultStr = `$${dailyRate}`;
                                                            } else if (autoStatus === "Eligible" && dailyRate === 0) {
                                                                defaultStr = "$0"; 
                                                            }

                                                            const valToDisplay = (manualVal !== undefined && manualVal !== '') ? manualVal : defaultStr;
                                                            
                                                            const val = String(valToDisplay);
                                                            const isOff = val.toLowerCase() === 'off';
                                                            const isPending = val === '-' || val.toLowerCase() === 'pending';
                                                            const isNum = !isNaN(parseFloat(val.replace('$', ''))) && val.trim() !== '';
                                                            const isViolation = !isOff && !isPending && !isNum && val.trim() !== '';

                                                            if (isNum) rowTotal += parseFloat(val.replace('$', ''));

                                                            let bgClass = "bg-transparent";
                                                            let textClass = "text-slate-300";

                                                            if (isOff) {
                                                                bgClass = "bg-slate-700/50";
                                                                textClass = "text-slate-400";
                                                            } else if (isViolation) {
                                                                bgClass = "bg-rose-900/10";
                                                                textClass = "text-rose-400 font-bold text-[9px]";
                                                            } else if (isNum) {
                                                                textClass = "text-emerald-400 font-bold";
                                                            } else if (isPending) {
                                                                textClass = "text-slate-500";
                                                            }

                                                            return (
                                                                <td key={dayIdx} className="px-2 py-1.5 border-r border-slate-700/50">
                                                                {isEditing ? (
                                                                    <input
                                                                    type="text"
                                                                    className={`w-full min-w-[70px] text-center text-xs px-2 py-1.5 outline-none focus:ring-1 focus:ring-indigo-500 border border-slate-700 rounded transition-colors placeholder-slate-600 ${bgClass} ${textClass}`}
                                                                    value={manualVal || ''}
                                                                    onChange={(e) => updateBonusCell(driverKey, dayIdx, e.target.value)}
                                                                    placeholder={defaultStr}
                                                                    />
                                                                ) : (
                                                                    <div className={`w-full min-w-[70px] text-center text-xs px-2 py-1.5 border border-slate-700/50 rounded ${bgClass} ${textClass} whitespace-nowrap overflow-hidden text-ellipsis`} title={val}>
                                                                    {isNum && !val.includes('$') ? `$${val}` : (val || '-')}
                                                                    </div>
                                                                )}
                                                                </td>
                                                            );
                                                            });

                                                        return (
                                                        <tr key={idx} className="hover:bg-slate-700/30 transition-colors">
                                                            {isEditingThisDriver ? (
                                                            <>
                                                                <td className="px-2 py-1.5 border-r border-slate-700"><input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-2 py-1 text-xs text-white outline-none" value={editBonusName.firstName} onChange={(e) => setEditBonusName({...editBonusName, firstName: e.target.value})} /></td>
                                                                <td className="px-2 py-1.5 border-r border-slate-700"><input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-2 py-1 text-xs text-white outline-none" value={editBonusName.lastName} onChange={(e) => setEditBonusName({...editBonusName, lastName: e.target.value})} /></td>
                                                            </>
                                                            ) : (
                                                            <>
                                                                <td className="px-4 py-2 text-xs font-bold text-slate-200 border-r border-slate-700">{driver.firstName}</td>
                                                                <td className="px-4 py-2 text-xs font-bold text-slate-200 border-r border-slate-700">{driver.lastName}</td>
                                                            </>
                                                            )}
                                                            <td className="px-4 py-2 text-xs font-black text-center text-slate-300 bg-slate-900/30 border-r border-slate-700 shadow-inner">${surveyBonus}</td>
                                                            {evaluatedDays}
                                                            <td className="px-4 py-2 text-sm font-black text-center text-emerald-400 bg-slate-900/50 border-l border-slate-700 shadow-inner">
                                                            ${rowTotal}
                                                            </td>
                                                            {isEditing && (
                                                            <td className="px-4 py-2 text-center border-l border-slate-700">
                                                                <div className="flex items-center justify-center gap-1.5">
                                                                {isEditingThisDriver ? (
                                                                    <button onClick={() => saveBonusDriverEdit(driverKey)} className="p-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded transition-colors shadow-lg cursor-pointer" title="Save Name">
                                                                    <Check className="w-3.5 h-3.5" />
                                                                    </button>
                                                                ) : (
                                                                    <button onClick={() => { setEditingBonusDriver(driverKey); setEditBonusName({ firstName: driver.firstName || '', lastName: driver.lastName || '' }); }} className="p-1.5 text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/30 rounded transition-colors cursor-pointer" title="Edit Name">
                                                                    <Edit3 className="w-3.5 h-3.5" />
                                                                    </button>
                                                                )}
                                                                <button onClick={() => hideBonusDriver(driverKey)} className="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded transition-colors cursor-pointer" title="Hide/Delete from Tracker">
                                                                    <Trash2 className="w-3.5 h-3.5" />
                                                                </button>
                                                                </div>
                                                            </td>
                                                            )}
                                                        </tr>
                                                        );
                                                    });
                                                })()}
                                                {isEditing && (
                                                    <tr className="bg-slate-900/30">
                                                        <td className="px-2 py-1.5 border-r border-slate-700">
                                                        <input type="text" placeholder="First Name" className="w-full bg-slate-950 border border-emerald-500/50 rounded px-2 py-1 text-xs text-white outline-none focus:ring-1 focus:ring-emerald-500" value={newBonusDriver.firstName} onChange={(e) => setNewBonusDriver({...newBonusDriver, firstName: e.target.value})} />
                                                        </td>
                                                        <td className="px-2 py-1.5 border-r border-slate-700">
                                                        <input type="text" placeholder="Last Name" className="w-full bg-slate-950 border border-emerald-500/50 rounded px-2 py-1 text-xs text-white outline-none focus:ring-1 focus:ring-emerald-500" value={newBonusDriver.lastName} onChange={(e) => setNewBonusDriver({...newBonusDriver, lastName: e.target.value})} onKeyDown={(e) => e.key === 'Enter' && handleAddManualDriver()} />
                                                        </td>
                                                        <td colSpan={10} className="px-4 py-2 border-l border-slate-700 text-left shadow-inner">
                                                        <button onClick={handleAddManualDriver} disabled={!newBonusDriver.firstName.trim()} className="flex items-center gap-2 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded text-xs font-bold transition-all shadow-lg cursor-pointer">
                                                            <PlusCircle className="w-3.5 h-3.5" /> Add Driver
                                                        </button>
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    <footer data-html2canvas-ignore="true" className={`fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-6 py-4 z-50 flex flex-col md:flex-row justify-between items-center gap-4 ${isCapturing ? 'hidden' : ''}`}>
                        <div className="flex items-center gap-3 overflow-x-auto max-w-full no-scrollbar">
                            <div className={`w-2.5 h-2.5 rounded-full ${localIsIdle ? 'bg-amber-500' : 'bg-emerald-500 animate-pulse shadow-[0_0_10px_rgba(16,185,129,0.4)]'} flex-shrink-0`} />
                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex-shrink-0">Online Users:</span>
                            
                            <div className="flex items-center gap-2">
                                <div className="relative shrink-0">
                                    {isEditingName ? (
                                        <div className="flex items-center gap-2 animate-in slide-in-from-left-2 duration-200">
                                            <input autoFocus className="bg-slate-800 px-3 py-1 rounded border border-indigo-500/50 text-xs font-bold text-white outline-none focus:ring-1 focus:ring-indigo-500" value={String(userName)} onChange={(e) => setUserName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && saveUserName(userName)} onBlur={() => saveUserName(userName)} />
                                            <button onClick={() => saveUserName(userName)} className="bg-indigo-600 text-white p-1 rounded hover:bg-indigo-500 transition-colors cursor-pointer"><Check className="w-3 h-3" /></button>
                                        </div>
                                    ) : (
                                        <button onClick={() => setIsEditingName(true)} className={`flex items-center gap-2 px-3 py-1 rounded-full border text-[10px] font-black transition-all cursor-pointer ${localIsIdle ? 'bg-amber-900/40 border-amber-500/40 text-amber-200 hover:border-amber-400' : 'bg-indigo-900/40 border-indigo-500/40 text-indigo-200 hover:border-indigo-400'}`}>
                                            <div className={`w-1.5 h-1.5 rounded-full ${localIsIdle ? 'bg-amber-500' : 'bg-emerald-500'}`} />
                                            YOU: {String(userName || 'SET NAME')} {localIsIdle && <span className="opacity-60 font-bold">(Idle)</span>}
                                            <Edit3 className="w-2.5 h-2.5 opacity-50" />
                                        </button>
                                    )}
                                </div>

                                {activeUsers.filter(u => u.uid !== user?.uid).map(u => {
                                    const isUserIdle = u.status === 'idle';
                                    return (
                                        <div key={u.uid} className={`flex items-center gap-1.5 px-3 py-1 rounded-full border text-[10px] font-bold transition-all ${isUserIdle ? 'bg-amber-900/20 border-amber-700/50 text-amber-500/80' : 'bg-slate-800/60 border-slate-700 text-slate-400'}`}>
                                            <div className={`w-1.5 h-1.5 rounded-full ${isUserIdle ? 'bg-amber-500/60' : 'bg-emerald-500/60'}`} />
                                            {String(u.name || 'Teammate')} {isUserIdle && <span className="opacity-60 text-[9px]">(Idle)</span>}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Status: <span className="text-emerald-500 tracking-widest">KPI v2.5 Active</span></div>
                    </footer>

                    {isMasterModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col overflow-hidden max-h-[80vh] animate-in zoom-in-95 duration-200">
                                <div className="px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                                    <h2 className="text-lg font-black text-white flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-400" /> Manage Master Lists</h2>
                                    <button onClick={() => setIsMasterModalOpen(false)} className="text-slate-400 hover:text-white cursor-pointer"><X className="w-5 h-5" /></button>
                                </div>
                                
                                <div className="flex border-b border-slate-700 bg-slate-800/50 px-2">
                                    {[
                                        { id: 'contractors', label: 'Contractors' },
                                        { id: 'drivers', label: 'Drivers' },
                                        { id: 'helpers', label: 'Helpers' }
                                    ].map(tab => (
                                        <button 
                                            key={tab.id}
                                            onClick={() => setMasterActiveTab(tab.id)}
                                            className={`px-4 py-3 text-xs font-bold tracking-widest uppercase transition-colors border-b-2 cursor-pointer ${masterActiveTab === tab.id ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                                        >
                                            {tab.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="p-6 overflow-y-auto flex-1">
                                    <div className="flex gap-3 mb-6">
                                        <input 
                                            type="text" 
                                            placeholder="Name" 
                                            className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none"
                                            value={newMasterItem.name}
                                            onChange={e => setNewMasterItem({...newMasterItem, name: e.target.value})}
                                            onKeyDown={e => e.key === 'Enter' && addMasterListItem()}
                                        />
                                        {masterActiveTab !== 'contractors' && (
                                            <input 
                                                type="text" 
                                                placeholder="Phone Number (Optional)" 
                                                className="w-48 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none"
                                                value={newMasterItem.phone}
                                                onChange={e => setNewMasterItem({...newMasterItem, phone: e.target.value})}
                                                onKeyDown={e => e.key === 'Enter' && addMasterListItem()}
                                            />
                                        )}
                                        <button 
                                            onClick={addMasterListItem}
                                            disabled={!newMasterItem.name.trim()}
                                            className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors cursor-pointer"
                                        >
                                            Add
                                        </button>
                                    </div>

                                    <div className="space-y-2">
                                        {(masterLists[masterActiveTab] || []).length === 0 ? (
                                            <div className="text-center py-8 text-slate-500 text-xs font-bold uppercase tracking-widest italic">List is empty.</div>
                                        ) : (
                                            (masterLists[masterActiveTab] || []).map(item => (
                                                <div key={item.id} className="flex justify-between items-center bg-slate-800 p-3 rounded-lg border border-slate-700">
                                                    {editingMasterId === item.id ? (
                                                        <div className="flex items-center gap-2 w-full animate-in fade-in duration-200">
                                                            <input
                                                                autoFocus
                                                                type="text"
                                                                className="flex-1 bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none"
                                                                value={editMasterValues.name}
                                                                onChange={(e) => setEditMasterValues({ ...editMasterValues, name: e.target.value })}
                                                                onKeyDown={(e) => e.key === 'Enter' && saveEditMasterItem(item.id)}
                                                            />
                                                            {masterActiveTab !== 'contractors' && (
                                                                <input
                                                                    type="text"
                                                                    className="w-40 bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none"
                                                                    placeholder="Phone"
                                                                    value={editMasterValues.phone}
                                                                    onChange={(e) => setEditMasterValues({ ...editMasterValues, phone: e.target.value })}
                                                                    onKeyDown={(e) => e.key === 'Enter' && saveEditMasterItem(item.id)}
                                                                />
                                                            )}
                                                            <div className="flex gap-1.5 ml-2">
                                                                <button onClick={() => saveEditMasterItem(item.id)} className="p-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded transition-colors shadow-lg shadow-emerald-900/40 cursor-pointer" title="Save"><Check className="w-4 h-4" /></button>
                                                                <button onClick={() => setEditingMasterId(null)} className="p-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded border border-slate-600 transition-colors cursor-pointer" title="Cancel"><X className="w-4 h-4" /></button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            <div className="flex items-center gap-4">
                                                                <span className="font-bold text-slate-200">{item.name}</span>
                                                                {item.phone && <span className="text-xs text-slate-400 font-mono bg-slate-900 px-2 py-1 rounded border border-slate-700">📞 {item.phone}</span>}
                                                            </div>
                                                            <div className="flex items-center gap-1">
                                                                <button 
                                                                    onClick={() => startEditingMasterItem(item)}
                                                                    className="text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/30 p-1.5 rounded transition-colors cursor-pointer"
                                                                    title="Edit"
                                                                >
                                                                    <Edit3 className="w-4 h-4" />
                                                                </button>
                                                                <button 
                                                                    onClick={() => removeMasterListItem(item.id)}
                                                                    className="text-slate-500 hover:text-rose-400 hover:bg-rose-900/30 p-1.5 rounded transition-colors cursor-pointer"
                                                                    title="Delete"
                                                                >
                                                                    <Trash2 className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                                
                                <div className="px-6 py-4 border-t border-slate-700 bg-slate-800 flex justify-between items-center">
                                    <button 
                                        onClick={() => saveMasterLists(DEFAULT_MASTER_LISTS)} 
                                        className="flex items-center gap-2 px-3 py-1.5 bg-slate-900 border border-slate-700 hover:border-indigo-500 text-indigo-400 rounded-lg font-bold text-xs cursor-pointer transition-colors"
                                        title="Loads the names extracted from the Pflugerville Excel image"
                                    >
                                        <Download className="w-3.5 h-3.5" /> Auto-Load Roster
                                    </button>
                                    <button onClick={() => setIsMasterModalOpen(false)} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-bold text-sm cursor-pointer shadow-lg shadow-indigo-900/40">Done</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {recordToDelete && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex items-center gap-3 text-rose-400 mb-4">
                                    <AlertTriangle className="w-6 h-6" />
                                    <h3 className="text-lg font-black">Confirm Deletion</h3>
                                </div>
                                <p className="text-sm text-slate-300 mb-6">
                                    Are you sure you want to delete the data for <span className="font-bold text-white">{recordToDelete}</span>? This action cannot be undone.
                                </p>
                                <div className="flex gap-3 justify-end">
                                <button
                                    onClick={() => setRecordToDelete(null)}
                                    className="px-4 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer"
                                >
                                    Cancel
                                </button>
                                <button
                                    onClick={confirmDeleteRecord}
                                    className="px-4 py-2 rounded-lg font-bold text-sm bg-rose-600 text-white hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/40 cursor-pointer"
                                >
                                    Delete Record
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {scheduleAlert && (
                    <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
                        <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200">
                            <div className="flex items-center gap-3 text-amber-400 mb-4">
                                <AlertTriangle className="w-6 h-6" />
                                <h3 className="text-lg font-black">{scheduleAlert.title}</h3>
                            </div>
                            <p className="text-sm text-slate-300 mb-6 whitespace-pre-wrap leading-relaxed">
                                {scheduleAlert.message}
                            </p>
                            <div className="flex justify-end">
                                <button
                                    onClick={() => setScheduleAlert(null)}
                                    className="px-5 py-2.5 rounded-lg font-black tracking-widest text-xs uppercase bg-indigo-600 text-white hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-900/40 cursor-pointer"
                                >
                                    Acknowledge
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    };

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);
    root.render(<App />);
    </script>
</body>
</html>
