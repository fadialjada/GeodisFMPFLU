        (() => {
            // Keep phone overlays above the software keyboard and browser chrome.
            const phoneQuery = window.matchMedia('(max-width: 767px), (max-width: 1023px) and (pointer: coarse)');
            const updatePhoneViewport = () => {
                const style = document.documentElement.style;
                if (!phoneQuery.matches) {
                    style.removeProperty('--phone-viewport-height');
                    style.removeProperty('--phone-viewport-top');
                    return;
                }
                const viewport = window.visualViewport;
                style.setProperty('--phone-viewport-height', `${viewport?.height || window.innerHeight}px`);
                style.setProperty('--phone-viewport-top', `${viewport?.offsetTop || 0}px`);
            };
            updatePhoneViewport();
            window.addEventListener('resize', updatePhoneViewport, { passive: true });
            window.visualViewport?.addEventListener('resize', updatePhoneViewport, { passive: true });
            window.visualViewport?.addEventListener('scroll', updatePhoneViewport, { passive: true });
            let dashboardScrollTimer;
            const showDashboardScrollbar = () => {
                document.documentElement.classList.add('show-dashboard-scrollbar');
                window.clearTimeout(dashboardScrollTimer);
                dashboardScrollTimer = window.setTimeout(() => {
                    document.documentElement.classList.remove('show-dashboard-scrollbar');
                }, 900);
            };
            document.addEventListener('scroll', showDashboardScrollbar, true);
            window.addEventListener('wheel', showDashboardScrollbar, { passive: true });
            window.addEventListener('touchmove', showDashboardScrollbar, { passive: true });
            window.addEventListener('keydown', (event) => {
                if (['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(event.key)) {
                    showDashboardScrollbar();
                }
            });
        })();

            const afterHours = {};

                const sourceDay = sourceAfterHoursDays[idx];
                afterHours[targetDay] = sourceDay && sourceSchedule?.afterHours?.[sourceDay]
                    ? { ...sourceSchedule.afterHours[sourceDay] }
                    : { person1: '', person2: '' };
            });
            return { employees: copiedEmployees, afterHours };

        const officeScheduleHasAssignments = (schedule) => {
            const hasEmployeeShift = (schedule?.employees || []).some(emp =>
                Object.values(emp.shifts || {}).some(shift => Boolean(shift?.start || shift?.end || shift?.isOff))
            );
            const hasAfterHoursAssignment = Object.values(schedule?.afterHours || {}).some(day => Boolean(day?.person1 || day?.person2));
            return hasEmployeeShift || hasAfterHoursAssignment;

        const calculateOfficeWarnings = (dataObj, days) => {
            if (!dataObj) return { coverage: {}, conflicts: {} };
            const coverage = {};
            const conflicts = {};

            days.forEach(dayStr => {
                conflicts[dayStr] = [];
                const ah = dataObj.afterHours?.[dayStr];
                if (ah) {
                    const afterHoursPeople = [ah.person1, ah.person2].filter(Boolean);
                    if (afterHoursPeople.length > 1 && afterHoursPeople[0] === afterHoursPeople[1]) {
                        conflicts[dayStr].push(`${afterHoursPeople[0]} is assigned twice for After-Hours on the same day.`);
                    }
                    afterHoursPeople.forEach(personName => {
                        if (personName) {
                            const emp = (dataObj.employees || []).find(e => e.name === personName);
                            if (emp && emp.shifts[dayStr]?.isOff) {
                                conflicts[dayStr].push(`${personName} is assigned to After-Hours but is marked"Off".`);
                            }
                        }
                    });
                }

                const shifts = [];
                (dataObj.employees || []).forEach(emp => {
                    const shift = emp.shifts[dayStr];
                    if (shift && !shift.isOff && shift.start && shift.end) {
                        const [sH, sM] = shift.start.split(':').map(Number);
                        const [eH, eM] = shift.end.split(':').map(Number);
                        shifts.push([sH * 60 + sM, eH * 60 + eM]);
                    }
                });

                shifts.sort((a, b) => a[0] - b[0]);
                const merged = [];
                shifts.forEach(s => {
                    if (!merged.length) merged.push([...s]);
                    else {
                        const last = merged[merged.length - 1];
                        if (s[0] <= last[1]) last[1] = Math.max(last[1], s[1]);
                        else merged.push([...s]);
                    }
                });

                const covers = merged.some(m => m[0] <= 300 && m[1] >= 1170); // 5 AM to 7:30 PM
                if (!covers && shifts.length > 0) coverage[dayStr] = true;
            });

            const weeklyWorkDays = {};
            (dataObj.employees || []).forEach(emp => {
                days.forEach(dayStr => {
                    const shift = emp.shifts?.[dayStr];
                    if (emp.name && shift && !shift.isOff && shift.start && shift.end) {
                        weeklyWorkDays[emp.name] = (weeklyWorkDays[emp.name] || 0) + 1;
                    }
                });
            });
            Object.entries(weeklyWorkDays).forEach(([name, count]) => {
                if (count > 6) {
                    conflicts[days[0]].push(`${name} is scheduled ${count} days this week. Confirm before overriding the six-day limit.`);

            });

            return { coverage, conflicts };

        const levenshteinDistance = (str1, str2) => {
            const a = (str1 || '').toLowerCase();
            const b = (str2 || '').toLowerCase();
            if (a === b) return 0;
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        };

            const a = name1.toLowerCase().trim();
            const b = name2.toLowerCase().trim();
            if (a === b) return true;
            const maxDist = Math.max(a.length, b.length) > 12 ? 2 : 1;
            if (Math.min(a.length, b.length) <= 3) return false;
            return levenshteinDistance(a, b) <= maxDist;
        };

        const getScreenshotScale = (width, height) => {
            if (!(width > 0 && height > 0 && Number.isFinite(width) && Number.isFinite(height))) {
                throw new Error('The screenshot area has no usable size.');
            }
            const longestEdge = Math.max(width, height);
            // Render text and vectors at export resolution, preserving the panel's proportions.
            const desiredScale = Math.max(2, 7680 / longestEdge);
            return Math.min(desiredScale, 16384 / longestEdge, Math.sqrt((64 * 1024 * 1024) / (width * height)));
        };

        const downloadScreenshotPng = async (element, fileName, options) => {
            if (document.fonts?.ready) await document.fonts.ready;
            const scale = getScreenshotScale(options.width, options.height);
            let lastError;
            // Smaller devices may need a lower resolution to finish a large export.
            for (const factor of [1, 0.5, 0.25]) {
                let canvas;
                let blob;
                try {
                    canvas = await window.html2canvas(element, { ...options, scale: scale * factor });
                    if (!canvas.width || !canvas.height) throw new Error('Unable to allocate screenshot canvas.');
                    blob = await new Promise((resolve, reject) => {
                        canvas.toBlob(result => result ? resolve(result) : reject(new Error('Unable to encode screenshot.')), 'image/png');
                    });
                } catch (error) {
                    lastError = error;
                } finally {
                    if (canvas) { canvas.width = 0; canvas.height = 0; }
                }
                if (!blob) continue;
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                return;
            }
            throw lastError || new Error('Unable to create screenshot.');

                const presenceDocId = `${currentUser.uid}_${presenceSessionId}`;

                const updatePresence = async () => {
                    try {
                        const now = Date.now();
                        const lastInteraction = lastUserActivityRef.current || now;
                        if (document.hidden && !presenceHiddenSinceRef.current) presenceHiddenSinceRef.current = now;
                        if (!document.hidden) presenceHiddenSinceRef.current = null;
                        const hiddenSince = presenceHiddenSinceRef.current;
                        const hiddenForMs = hiddenSince ? now - hiddenSince : 0;
                        const status = !document.hidden ? 'active' : hiddenForMs >= PRESENCE_AWAY_AFTER_MS ? 'away' : 'idle';
                        const presenceRef = doc(db, 'artifacts', appId, 'public', 'data', 'presence', presenceDocId);
                        lastPresenceWrite = now;
                        await setDoc(presenceRef, {
                            uid: currentUser.uid,
                            sessionId: presenceSessionId,
                            name: getSavedDisplayName(currentUser),
                            lastActive: lastInteraction,
                            lastInteraction,
                            lastSeen: now,
                            status,
                            hiddenSince: hiddenSince || null
                        });
                    } catch (e) {}
                };
                const markUserActivity = () => {
                    const now = Date.now();
                    if (!document.hidden) presenceHiddenSinceRef.current = null;
                    lastUserActivityRef.current = now;
                    if (now - lastPresenceWrite > 15000) updatePresence();
                };
                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        presenceHiddenSinceRef.current = Date.now();
                        updatePresence();
                    } else {
                        presenceHiddenSinceRef.current = null;
                        markUserActivity();
                    }
                };
                const activityEvents = ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart', 'pointerdown'];
                activityEvents.forEach(eventName => window.addEventListener(eventName, markUserActivity, true));
                document.addEventListener('visibilitychange', handleVisibilityChange);
                updatePresence();
                const intervalId = setInterval(updatePresence, 20000);
                const presenceCol = collection(db, 'artifacts', appId, 'public', 'data', 'presence');
                const unsubscribePresence = onSnapshot(presenceCol, (snapshot) => {
                    const byUser = new Map();
                    const now = Date.now();
                    const threshold = now - offlineAfterMs; 
                    snapshot.forEach(doc => { 
                        const presence = doc.data();
                        const lastSeen = Number(presence.lastSeen || presence.lastActive || 0);
                        if (lastSeen > threshold) {
                            const hiddenSince = Number(presence.hiddenSince || 0);
                            const inferredStatus = hiddenSince
                                ? (now - hiddenSince >= PRESENCE_AWAY_AFTER_MS ? 'away' : 'idle')
                                : 'active';
                            const sessionPresence = {
                                ...presence,
                                status: presence.hiddenSince ? inferredStatus : (presence.status || inferredStatus)
                            };
                            const uid = sessionPresence.uid || doc.id;
                            const existing = byUser.get(uid);
                            const rank = { active: 3, idle: 2, away: 1 };
                            const existingStatusRank = existing ? rank[existing.status] || 0 : 0;
                            const sessionStatusRank = rank[sessionPresence.status] || 0;
                            if (!existing || sessionStatusRank > existingStatusRank || (sessionStatusRank === existingStatusRank && lastSeen > Number(existing.lastSeen || 0))) {
                                byUser.set(uid, {
                                    ...existing,
                                    ...sessionPresence,
                                    uid,
                                    lastSeen: Math.max(lastSeen, Number(existing?.lastSeen || 0)),
                                    hiddenSince: sessionPresence.status === 'active' ? null : (sessionPresence.hiddenSince || existing?.hiddenSince || null)
                                });
                            } else if (existing) {
                                byUser.set(uid, {
                                    ...existing,
                                    lastSeen: Math.max(lastSeen, Number(existing.lastSeen || 0))
                                });
                            }
                        }
                    });
                    setActiveUsers(Array.from(byUser.values()));
                }, (err) => console.error(err));
                return () => {
                    clearInterval(intervalId);
                    unsubscribePresence();
                    activityEvents.forEach(eventName => window.removeEventListener(eventName, markUserActivity, true));
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'presence', presenceDocId)).catch(() => {});
                };
            }, [user, userName, masterLists.nameOverrides]);

            const isDashboardBackgroundEvent = (event, allowDoubleClickSelection = false) => {

                if (event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return false;
                if (isPreloadModalOpen || isParkingModalOpen || isMasterModalOpen || recordToDelete || isCreatingDriverCall || isHeaderCalendarOpen) return false;
                if (!allowDoubleClickSelection && window.getSelection()?.toString().trim()) return false;

                const target = event.target;
                if (!(target instanceof Element)) return false;
                const controls = 'button, a, input, select, textarea, label, summary, video, audio, [contenteditable]:not([contenteditable="false"]), [role="button"], [role="link"], [role="dialog"], [tabindex], .cursor-pointer, [data-dashboard-edit-ignore], header, nav, footer';

                                officeOneTimeOverride: false,
                                officeCopiedFromWeekStart: sourceWeekStart,
                                lastUpdatedBy: userName || currentUid,

                            };

                            await setDoc(nextOfficeRef, copiedOfficeSchedule);

            const handlePasteRoutes = (e) => {
                e.preventDefault();
                const text = e.clipboardData?.getData('text/plain') || '';
                if (!text) return;
                if (e.target) e.target.value ="Processing data...";

                const rows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r);
                const parsedRoutes = [];

                for (const row of rows) {
                    const cols = row.split('\t').map(c => c.trim());
                    if (cols.length < 4) continue;

                    const rawStr = row.toLowerCase();
                    if ((rawStr.includes('door') && rawStr.includes('route')) || rawStr.includes('preload for')) continue;

                    const doorVal = cols[1] || '';
                    const suVal = cols[2] || '';
                    const routeVal = cols[3] || '';
                    
                    if (!doorVal && !suVal && !routeVal) continue;

                    const uniformRaw = cols[12] ? cols[12].toLowerCase() : '';
                    const isUniform = uniformRaw === 'yes';
                    const uniformNoteText = (!isUniform && uniformRaw && uniformRaw !== 'no') ? cols[12] : '';

                    parsedRoutes.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        cnt: cols[0] || '',
                        door: doorVal,
                        serviceUnit: suVal,
                        route: routeVal,
                        contractor: cols[4] || '',
                        driver: cols[5] || '',
                        helper: cols[6] || '',
                        stops: cols[7] || '',
                        pcs: cols[8] || '',
                        cube: cols[9] || '',
                        hos: cols[10] || '',
                        mileage: cols[11] || '',
                        uniform: isUniform, 
                        uniformNote: uniformNoteText,

                        checkedIn: false
                    });

            const handlePasteMetrics = (e) => {
                e.preventDefault();
                const text = e.clipboardData?.getData('text/plain') || '';
                if (!text) return;
                if (e.target) e.target.value ="Processing data...";

                if (metricsSubTab === 'feedback') {
                    const fRows = text.split(/\r?\n/);
                    const fParsedData = [];
                    let currentFeedback = null;
                    
                    // Tracking for Auto-Fill-Down Logic
                    let lastDate = '';
                    let lastFirstName = '';
                    let lastLastName = '';
                    let lastType = '';
                    
                    for (let i = 0; i < fRows.length; i++) {
                        const rowText = fRows[i];
                        const cols = rowText.split('\t');
                        
                        const possibleScore = cols[4] ? parseFloat(cols[4].replace(/[^0-9.-]/g, '')) : NaN;
                        const hasOrderNum = cols[5] && cols[5].includes('SO-');

                        if (cols.length >= 5 && (!isNaN(possibleScore) || hasOrderNum)) {
                            if (currentFeedback) fParsedData.push(currentFeedback);
                            
                            // Get raw values, use tracking variable if blank
                            const rawDate = cols[0]?.trim();
                            const rawFirstName = cols[1]?.trim();
                            const rawLastName = cols[2]?.trim();
                            const rawType = cols[3]?.trim();
                            
                            if (rawDate) lastDate = rawDate;
                            if (rawFirstName) lastFirstName = rawFirstName;
                            if (rawLastName) lastLastName = rawLastName;
                            if (rawType) lastType = rawType;
                            
                            currentFeedback = {
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5) + i,
                                date: lastDate,
                                firstName: lastFirstName,
                                lastName: lastLastName,
                                type: lastType,
                                score: !isNaN(possibleScore) ? possibleScore : 0,
                                orderNum: cols[5]?.trim(),
                                comment: (cols.slice(6).join('\t') || '').replace(/^"|"$/g, '').trim()
                            };
                        } else if (currentFeedback && rowText.trim() !== '') {
                            currentFeedback.comment += (currentFeedback.comment ? '\n' : '') + rowText.trim().replace(/^"|"$/g, '');
                        }
                    }
                    if (currentFeedback) fParsedData.push(currentFeedback);

                    if (e.target) e.target.value ="";

                    if (fParsedData.length > 0) {
                        const nd = JSON.parse(JSON.stringify(data));
                        if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                        if (!nd.metricsTracker.feedback) nd.metricsTracker.feedback = [];
                        nd.metricsTracker.feedback = [...nd.metricsTracker.feedback, ...fParsedData];
                        setData(nd);
                        setPasteFeedback(`✅ Successfully extracted ${fParsedData.length} feedback reviews!`);
                    } else {
                        setPasteFeedback(`❌ Could not detect feedback data.`);
                    }
                    setTimeout(() => setPasteFeedback(''), 5000);
                    return; 
                }

                const mRows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r);
                const mParsedData = [];
                let foundTotals = null;

                for (const row of mRows) {
                    const cols = row.split('\t').map(c => c.trim());
                    const rawStr = row.toLowerCase();
                    
                    if (rawStr.includes('minimum target') || rawStr.includes('driverkey') || rawStr.includes('max. driver')) continue;

                    const nums = cols.map(c => c.replace(/[^0-9.-]/g, '')).filter(c => c !== '').map(Number);
                    if (rawStr.includes('grand total') || rawStr.includes('total') || (cols[0] === '' && cols[1] === '' && nums.length >= 4)) {
                        if (nums.length >= 4) {
                            foundTotals = {
                                surveyCnt: nums[nums.length - 5] || 0,
                                surveyAvg: nums[nums.length - 4] || 0,
                                onTime: nums[nums.length - 3] || 0,
                                completion: nums[nums.length - 2] || 0,
                                exchange: nums[nums.length - 1] || 0
                            };
                        }
                        continue;
                    }

                    if (cols.length < 4) continue;

                    let offset = /^\d+/.test(cols[0]) ? 0 : -1;
                    const parseNum = (val) => parseFloat((val || '').replace(/[^0-9.-]/g, '')) || 0;

                    const firstName = cols[1 + offset] || '';
                    const lastName = cols[2 + offset] || '';
                    if (!firstName && !lastName) continue;

                    mParsedData.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        firstName: firstName,
                        lastName: lastName,
                        surveyCnt: parseInt(parseNum(cols[3 + offset]), 10) || 0,
                        surveyAvg: parseNum(cols[4 + offset]),
                        onTime: parseNum(cols[5 + offset]),
                        completion: parseNum(cols[6 + offset]),
                        exchange: parseNum(cols[7 + offset])
                    });
                }

                if (e.target) e.target.value ="";

                if (mParsedData.length > 0) {
                    const nd = JSON.parse(JSON.stringify(data));
                    if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                    
                    const existing = nd.metricsTracker[metricsSubTab] || [];
                    mParsedData.forEach(newRow => {
                        const matchIdx = existing.findIndex(r => r.firstName === newRow.firstName && r.lastName === newRow.lastName);
                        if (matchIdx >= 0) existing[matchIdx] = newRow;
                        else existing.push(newRow);
                    });
                    nd.metricsTracker[metricsSubTab] = existing;

                    if (foundTotals) {
                        nd.metricsTracker[`${metricsSubTab}Totals`] = foundTotals;
                    } else if (nd.metricsTracker[`${metricsSubTab}Totals`]) {
                        delete nd.metricsTracker[`${metricsSubTab}Totals`];
                    }

                    setData(nd);

                    setPasteFeedback(`❌ Could not detect metrics data. Check format.`);
                }
                setTimeout(() => setPasteFeedback(''), 5000);
            };

            const getCountableRouteRows = (inputData) => {
                const d = inputData || DEFAULT_DATA;
                return (d.routeTable || []).filter(route => ['cnt', 'door', 'serviceUnit', 'route', 'contractor', 'driver', 'helper'].some(key => String(route?.[key] || '').trim()));
            };

            const isSameDayRoute = (route) => {
                const routeName = String(route?.route || '').toLowerCase();
                return /\bsame[\s-]*day\b/.test(routeName) || /\bsame[\s-]*s[\s-]*d\b/.test(routeName) || /\bs[\s-]*d\b/.test(routeName);
            };

            const getAutoRouteCounts = (inputData) => {
                const rows = getCountableRouteRows(inputData);
                const sameDayRows = rows.filter(isSameDayRoute);
                const normalRows = rows.filter(route => !isSameDayRoute(route));
                return {
                    hasRows: rows.length > 0,
                    allRoutes: rows.length,
                    routes: normalRows.length,
                    sameDayRoutes: sameDayRows.length,
                    orders: normalRows.reduce((sum, route) => sum + (Number(String(route?.stops || '').replace(/,/g, '')) || 0), 0)
                };
            };

            const withAutoRouteMetrics = (inputData) => {
                const cloned = JSON.parse(JSON.stringify(inputData || DEFAULT_DATA));
                if (!cloned.loadout) cloned.loadout = {};
                if (!Array.isArray(cloned.loadout.metrics)) cloned.loadout.metrics = [{ label:"Total Routes", value:"0" }, { label:"Number of Same Day Routes", value:"0" }];
                while (cloned.loadout.metrics.length < 2) cloned.loadout.metrics.push({ label:"", value:"0" });
                const autoCounts = getAutoRouteCounts(cloned);
                cloned.loadout.metrics[0] = { ...(cloned.loadout.metrics[0] || {}), label:"Total Routes", value: String(autoCounts.routes) };
                cloned.loadout.metrics[1] = { ...(cloned.loadout.metrics[1] || {}), label:"Number of Same Day Routes", value: String(autoCounts.sameDayRoutes) };
                return cloned;
            };

            const calculateKPIs = (inputData) => {
                const d = inputData || DEFAULT_DATA;
                const autoRouteCounts = getAutoRouteCounts(d);
                const routes = autoRouteCounts.hasRows ? autoRouteCounts.routes : Number(d.loadout?.metrics?.[0]?.value) || 0;
                const sameDayRoutes = autoRouteCounts.hasRows ? autoRouteCounts.sameDayRoutes : Number(d.loadout?.metrics?.[1]?.value) || 0;
                const orders = autoRouteCounts.hasRows ? autoRouteCounts.orders : 0;
                const pickups = Number(d.endOfDay?.risk?.[2]?.value) || 0;
                const basicCount = Number(d.loadout?.basicDeliveryCount) || 0;
                const thresholdCount = Number(d.loadout?.thresholdCount) || 0;
                const whiteGloveCount = Number(d.loadout?.whiteGloveCount) || 0;
                const uniform = Math.min(Number(d.loadout?.uniformCount) || 0, routes);
                const offDock = Math.min(Number(d.loadout?.offDockCount) || 0, routes);
                const eta = Math.min(Number(d.loadout?.etaCount) || 0, routes);
                const comp = Math.min(Number(d.loadout?.completedRoutesCount) || 0, routes);
                const missedDeliv = Number(d.midDay?.metrics?.[2]?.value) || 0;
                const earlyViolations = Number(d.midDay?.earlyCount) || 0;
                const missedEta = Math.max(0, routes - eta);
                const incompleteRoutes = Math.max(0, routes - comp);
                const onTimeOrders = Math.max(0, orders - (missedEta + missedDeliv + earlyViolations + incompleteRoutes));
                const otd = orders > 0 ? (onTimeOrders / orders) * 100 : 0;
                const offDockPerc = routes > 0 ? (offDock / routes) * 100 : 0;
                const etaPerc = routes > 0 ? (eta / routes) * 100 : 0;
                const compPerc = routes > 0 ? (comp / routes) * 100 : 0;
                const uniformPerc = routes > 0 ? (uniform / routes) * 100 : 0;
                const executionScore = (uniformPerc + offDockPerc + etaPerc + compPerc + otd) / 5;
                
                const transitDamages = Number(d.loadout?.transitDamage) || 0;
                const damageRate = orders > 0 ? (transitDamages / orders) * 100 : 0;
                const escalations = Number(d.loadout?.escalations) || 0;
                const escPerc = orders > 0 ? Math.max(0, ((orders - escalations) / orders) * 100) : 0;
                const pods = Number(d.loadout?.podsReconciled) || 0;
                const podPerc = orders > 0 ? Math.min(100, (pods / orders) * 100) : 0;
                const notHome = Number(d.loadout?.customerNotHome) || 0;
                const notHomePerc = orders > 0 ? (notHome / orders) * 100 : 0;
                const claims = Number(d.loadout?.claimsOpen) || 0;
                const claimsPerc = orders > 0 ? (claims / orders) * 100 : 0;

                const checkedInCount = (d.routeTable || []).filter(r => r.checkedIn).length;
                const checkedInPerc = routes > 0 ? (checkedInCount / routes) * 100 : 0;

                return { 
                    otd, executionScore, damageRate, offDockPerc, etaPerc, compPerc, uniformPerc, 
                    routes, sameDayRoutes, orders, pickups, basicCount, thresholdCount, whiteGloveCount, missedDeliv, earlyViolations, escPerc, podPerc, notHomePerc, claimsPerc, checkedInCount, checkedInPerc 
                };
            };

            const currentKPI = calculateKPIs(data);

                const yesterdayKPI = calculateKPIs(historyData.find(h => h.date === yesterdayStr));

                const currentDays = getOfficeWeekBoundaries(preloadActiveDate).days;
                const fixedFridayContractor = contractors.find(name => /LTC/i.test(name));
                const rotatingContractors = fixedFridayContractor ? contractors.filter(name => name !== fixedFridayContractor) : contractors;
                const fridayIndex = 4;
                const weekStart = new Date(currentDays[0] + 'T12:00:00');
                let rotationOffset = rotatingContractors.length > 0 ? Math.floor(weekStart.getTime() / (7 * 24 * 60 * 60 * 1000)) % rotatingContractors.length : 0;
                if (rotatingContractors.length > 1) {
                    const previousDate = new Date(currentDays[0] + 'T12:00:00');
                    previousDate.setDate(previousDate.getDate() - 1);
                    const previousStr = previousDate.toISOString().split('T')[0];
                    const previousContractor = allPreloadSchedules[previousStr]?.contractor || '';
                    if (previousContractor && rotatingContractors[rotationOffset] === previousContractor) {
                        rotationOffset = (rotationOffset + 1) % rotatingContractors.length;
                    }
                }
                let rotatingDayIndex = 0;
                const updates = currentDays.map((d, idx) => {
                    let contractorName;
                    if (fixedFridayContractor && idx === fridayIndex) {
                        contractorName = fixedFridayContractor;
                    } else {
                        const cIndex = rotatingContractors.length > 0 ? (rotatingDayIndex + rotationOffset) % rotatingContractors.length : idx % contractors.length;

                    return {
                        dateStr: d,
                        data: {

                if (!metricsList || metricsList.length === 0) return null;
                let totalCnt = 0; let sumAvgWeight = 0; let sumOnTime = 0; let sumCompletion = 0; let sumExchange = 0;
                let validOnTime = 0, validComp = 0, validExch = 0;
                
                metricsList.forEach(m => { 
                    const cnt = m.surveyCnt || 0;
                    totalCnt += cnt; 
                    sumAvgWeight += (m.surveyAvg || 0) * cnt; 
                    
                    if (m.onTime !== undefined && m.onTime > 0) { sumOnTime += m.onTime; validOnTime++; }
                    if (m.completion !== undefined && m.completion > 0) { sumCompletion += m.completion; validComp++; }
                    if (m.exchange !== undefined) { sumExchange += m.exchange; validExch++; }
                });
                
                const driverCount = metricsList.length;
                if (driverCount === 0) return null;
                
                return { 
                    surveyCnt: totalCnt, 
                    surveyAvg: totalCnt > 0 ? (sumAvgWeight / totalCnt).toFixed(2) :"0.00", 
                    onTime: validOnTime > 0 ? (sumOnTime / validOnTime).toFixed(2) :"0.00", 
                    completion: validComp > 0 ? (sumCompletion / validComp).toFixed(2) :"0.00",

                                                        const displayStatus = isCompleted ? 'Arrived' : (dayData.status || 'Pending');
                                                        return (
                                                            <tr key={dayStr} className="hover:bg-slate-700/30 transition-colors">
                                                                <td className="px-4 py-3">
                                                                    <div className="text-xs font-black text-slate-200">{dayName}</div>
                                                                    <div className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mt-0.5">{dateFormatted}</div>
                                                                </td>
                                                                <td className="px-4 py-3">
                                                                    {isAdminUser ? (
                                                                        <select 
                                                                            className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-slate-400 cursor-pointer shadow-inner"
                                                                            value={dayData.contractor}
                                                                            onChange={(e) => updatePreloadDay(dayStr, 'contractor', e.target.value)}

                                                                            <option value="">- Unassigned -</option>
                                                                            {(masterLists.contractors || []).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                                                                        </select>
                                                                    ) : (
                                                                        <div className="min-h-[34px] flex items-center rounded-lg bg-slate-950/40 border border-slate-700 px-3 py-2 text-xs font-bold text-slate-300">{dayData.contractor || '-'}</div>
                                                                    )}
                                                                </td>
                                                                <td className="px-4 py-3">
                                                                    <input 
                                                                        type="text" 
                                                                        placeholder="Door #" 
                                                                        className="w-full bg-slate-950 border border-slate-600 rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:border-slate-400 shadow-inner"
                                                                        value={dayData.door}
                                                                        onChange={(e) => updatePreloadDay(dayStr, 'door', e.target.value)}
                                                                    />
                                                                </td>
                                                                <td className="px-4 py-3 text-center">
                                                                    <button 
                                                                        onClick={() => updatePreloadDay(dayStr, 'status', isCompleted ? 'Pending' : 'Arrived')}
                                                                        className={`w-full px-3 py-2 rounded-lg text-[10px] font-black tracking-wider uppercase transition-all border cursor-pointer ${isCompleted ? 'bg-emerald-900/40 text-emerald-400 border-emerald-500/30 hover:bg-emerald-900/60' : 'bg-amber-900/40 text-amber-400 border-amber-500/30 hover:bg-amber-900/60'}`}
                                                                    >
                                                                        {displayStatus}
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {canOpenMasterLists && isMasterModalOpen && (
                        <div className={`dashboard-modal fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm transition-all ${isMasterFullscreen ? 'p-0' : 'p-4'}`}>
                            <div className={`bg-slate-900 border border-slate-700 shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200 ${isMasterFullscreen ? 'w-full h-full rounded-none' : 'rounded-2xl w-full max-w-[98%] md:max-w-6xl max-h-[90vh]'}`}>
                                <div className="dashboard-mobile-toolbar px-6 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800">
                                    <h2 className="text-lg font-black text-white flex items-center gap-2"><Settings className="w-5 h-5 text-indigo-400" /> {isAdminUser ? 'Manage Master Lists' : 'Contractor Plan'}</h2>
                                    <div data-master-screenshot-ignore="true" className="flex items-center gap-2">
                                        <button onClick={handleDownloadMasterScreenshot} className="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white transition-colors cursor-pointer" title="Download Master List Screenshot">
                                            <Camera className="w-4 h-4" />
                                        </button>
                                        <button onClick={() => setIsMasterFullscreen(!isMasterFullscreen)} className="p-2 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 hover:text-white transition-colors cursor-pointer" title={isMasterFullscreen ?"Restore Size" :"Maximize"}>
                                            {isMasterFullscreen ? <Minimize className="w-4 h-4" /> : <Maximize className="w-4 h-4" />}
                                        </button>
                                        <button onClick={() => setIsMasterEditing(!isMasterEditing)} className={`p-2 rounded-lg transition-colors cursor-pointer ${isMasterEditing ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400 hover:text-white border border-slate-700'}`} title={isAdminUser ? "Edit List" : "Edit Planned"}><Edit3 className="w-4 h-4" /></button>
                                        <button onClick={() => setIsMasterModalOpen(false)} className="text-slate-400 hover:text-white cursor-pointer p-2"><X className="w-5 h-5" /></button>
                                    </div>
                                </div>
                                
                                <div className="dashboard-modal-tabs flex border-b border-slate-700 bg-slate-800/50 px-2">
                                    {(isAdminUser ? [{ id: 'contractors', label: 'Contractors' }, { id: 'drivers', label: 'Drivers' }, { id: 'helpers', label: 'Helpers' }] : [{ id: 'contractors', label: 'Contractors' }]).map(tab => (
                                        <button key={tab.id} onClick={() => setMasterActiveTab(tab.id)} className={`px-4 py-3 text-xs font-bold tracking-widest uppercase transition-colors border-b-2 cursor-pointer ${masterActiveTab === tab.id ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>{tab.label}</button>
                                    ))}
                                </div>

                                <div data-master-screenshot-scroll="true" className="master-list-scroll-area p-6 overflow-y-auto flex-1">
                                    <div ref={masterScreenshotRef} data-master-screenshot-panel="true" className="bg-slate-900 rounded-2xl border border-slate-700 shadow-2xl p-4">
                                        <div className="flex items-center justify-between gap-4 mb-4">
                                            <div className="flex items-center gap-3">
                                                <Settings className="w-6 h-6 text-slate-100" />

                                                    <div className="text-sm font-black text-white tracking-wide">{isAdminUser ? 'Manage Master Lists' : 'Contractor Plan'}</div>
                                                    <div className="text-[10px] font-bold uppercase tracking-widest text-slate-500">{masterActiveTab} snapshot</div>
                                                </div>
                                            </div>
                                            <div className="text-[10px] font-black uppercase tracking-widest text-slate-500">{(masterLists[masterActiveTab] || []).length} Items</div>
                                        </div>
                                        <div data-master-screenshot-only="true" className="hidden border-y border-slate-700 bg-slate-800/50 -mx-4 px-2 mb-4">
                                            {(isAdminUser ? [{ id: 'contractors', label: 'Contractors' }, { id: 'drivers', label: 'Drivers' }, { id: 'helpers', label: 'Helpers' }] : [{ id: 'contractors', label: 'Contractors' }]).map(tab => (
                                                <div key={`shot-${tab.id}`} className={`px-4 py-3 text-xs font-bold tracking-widest uppercase border-b-2 ${masterActiveTab === tab.id ? 'border-slate-400 text-slate-200' : 'border-transparent text-slate-500'}`}>{tab.label}</div>
                                            ))}
                                        </div>
                                    {isMasterEditing && isAdminUser && (
                                        <div data-master-screenshot-ignore="true" className="flex flex-wrap items-end gap-3 mb-6 bg-slate-800/50 p-4 rounded-xl border border-slate-700">
                                            <div className="flex-1 min-w-[200px]">
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Name</label>
                                                <input type="text" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={newMasterItem.name} onChange={e => setNewMasterItem({...newMasterItem, name: e.target.value})} onKeyDown={e => e.key === 'Enter' && addMasterListItem()} />
                                            </div>
                                            {masterActiveTab === 'contractors' ? (
                                                <>
                                                    <div className="min-w-[180px] flex-1">
                                                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Owner</label>
                                                        <input type="text" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={newMasterItem.owner || ''} onChange={e => setNewMasterItem({...newMasterItem, owner: e.target.value})} />
                                                    </div>
                                                    <div className="w-24">
                                                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Total</label>
                                                        <input type="number" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={newMasterItem.total || ''} onChange={e => setNewMasterItem({...newMasterItem, total: e.target.value})} />
                                                    </div>
                                                    <div className="w-24">
                                                        <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Planned</label>
                                                        <input type="number" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={newMasterItem.planned || ''} onChange={e => setNewMasterItem({...newMasterItem, planned: e.target.value})} />
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="w-48">
                                                    <label className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1.5">Phone (Optional)</label>
                                                    <input type="text" className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={newMasterItem.phone} onChange={e => setNewMasterItem({...newMasterItem, phone: e.target.value})} />
                                                </div>
                                            )}
                                            <button onClick={addMasterListItem} disabled={!newMasterItem.name.trim()} className="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-2 rounded-lg font-bold text-sm transition-colors cursor-pointer h-[38px]">Add</button>
                                        </div>
                                    )}

                                    <div className={masterActiveTab === 'contractors' ?"dashboard-master-grid grid grid-cols-[repeat(auto-fit,minmax(240px,1fr))] gap-4" :"space-y-2"}>
                                        {(masterLists[masterActiveTab] || []).length === 0 ? (
                                            <div className="col-span-full text-center py-8 text-slate-500 text-xs font-bold uppercase tracking-widest italic">List is empty.</div>
                                        ) : (
                                            (masterLists[masterActiveTab] || []).map(item => (
                                                <div key={item.id} className={masterActiveTab === 'contractors' ?"bg-slate-800/80 p-5 rounded-2xl border border-slate-700/60 hover:bg-slate-800 hover:border-indigo-500/50 hover:shadow-xl hover:shadow-indigo-900/20 transition-all duration-300 flex flex-col gap-4 relative overflow-hidden group" :"bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md flex justify-between items-center"}>
                                                    {editingMasterId === item.id ? (
                                                        <div className="flex flex-col gap-2 w-full animate-in fade-in duration-200">
                                                            {isAdminUser ? (
                                                                <input autoFocus type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none font-bold" value={editMasterValues.name} onChange={(e) => setEditMasterValues({ ...editMasterValues, name: e.target.value })} />
                                                            ) : (
                                                                <div className="w-full bg-slate-950/40 border border-slate-700 rounded px-3 py-1.5 text-sm text-slate-300 font-bold">{editMasterValues.name}</div>
                                                            )}
                                                            {masterActiveTab === 'contractors' ? (
                                                                <div className="flex flex-col gap-2">
                                                                    {isAdminUser && (
                                                                        <div><span className="text-[9px] text-slate-400 uppercase font-bold pl-1 block mb-0.5">Owner</span><input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={editMasterValues.owner || ''} onChange={(e) => setEditMasterValues({ ...editMasterValues, owner: e.target.value })} /></div>
                                                                    )}
                                                                    <div className="flex gap-2">
                                                                    <div className="flex-1"><span className="text-[9px] text-slate-400 uppercase font-bold pl-1 block mb-0.5">Total</span><input type="number" disabled={!isAdminUser} className={`w-full rounded px-3 py-1.5 text-sm outline-none ${isAdminUser ? 'bg-slate-950 border border-indigo-500/50 text-white focus:ring-1 focus:ring-indigo-500' : 'bg-slate-950/40 border border-slate-700 text-slate-500 cursor-not-allowed'}`} value={editMasterValues.total} onChange={(e) => isAdminUser && setEditMasterValues({ ...editMasterValues, total: e.target.value })} /></div>
                                                                    <div className="flex-1"><span className="text-[9px] text-slate-400 uppercase font-bold pl-1 block mb-0.5">Planned</span><input type="number" autoFocus={!isAdminUser} className="w-full bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" value={editMasterValues.planned} onChange={(e) => setEditMasterValues({ ...editMasterValues, planned: e.target.value })} /></div>
                                                                    </div>
                                                                </div>
                                                            ) : (
                                                                <input type="text" className="w-full bg-slate-950 border border-indigo-500/50 rounded px-3 py-1.5 text-sm text-white focus:ring-1 focus:ring-indigo-500 outline-none" placeholder="Phone" value={editMasterValues.phone} onChange={(e) => setEditMasterValues({ ...editMasterValues, phone: e.target.value })} />
                                                            )}
                                                            <div className="flex gap-2 mt-1 z-20 relative">
                                                                <button onClick={() => saveEditMasterItem(item.id)} className="flex-1 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded flex justify-center items-center transition-colors shadow-lg shadow-emerald-900/40 cursor-pointer" title="Save"><Check className="w-4 h-4" /></button>
                                                                <button onClick={() => setEditingMasterId(null)} className="flex-1 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded border border-slate-600 flex justify-center items-center transition-colors cursor-pointer" title="Cancel"><X className="w-4 h-4" /></button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            {masterActiveTab === 'contractors' ? (
                                                                <>
                                                                    <div className="flex flex-col w-full h-full relative z-10">
                                                                        <div className="flex justify-between items-start mb-6">
                                                                            <div className="flex items-center gap-3 min-w-0 pr-2">
                                                                                <div className="shrink-0 flex items-center justify-center"><Truck className="w-8 h-8 text-slate-200" /></div>
                                                                                <div className="flex flex-col min-w-0">
                                                                                    <span className="font-black text-slate-100 text-sm tracking-wide leading-tight break-words" title={item.name}>{item.name}</span>
                                                                                    <span className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Fleet Partner</span>
                                                                                    {item.owner && <span className="text-[10px] font-bold text-slate-400 mt-1 leading-tight">Owner: {item.owner}</span>}
                                                                                </div>
                                                                            </div>
                                                                            {isMasterEditing && canEditMasterItem && (
                                                                                <div data-master-screenshot-ignore="true" className="flex items-center gap-1 shrink-0 bg-slate-900/50 p-1 rounded-lg border border-slate-700/50">
                                                                                    <button onClick={() => startEditingMasterItem(item)} className="text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/50 p-1.5 rounded transition-colors cursor-pointer" title="Edit"><Edit3 className="w-3 h-3" /></button>
                                                                                    {isAdminUser && <button onClick={() => removeMasterListItem(item.id)} className="text-slate-500 hover:text-rose-400 hover:bg-rose-900/50 p-1.5 rounded transition-colors cursor-pointer" title="Delete"><Trash2 className="w-3 h-3" /></button>}
                                                                                </div>
                                                                            )}
                                                                        </div>
                                                                        
                                                                        {(() => {
                                                                            const t = parseInt(item.total) || 0;
                                                                            const p = parseInt(item.planned) || 0;
                                                                            const avail = Math.max(0, t - p);
                                                                            const pct = t > 0 ? Math.min(100, (p / t) * 100) : 0;
                                                                            const isLow = avail === 0;
                                                                            return (
                                                                                <div className="mt-auto flex flex-col gap-4">
                                                                                    <div className="flex justify-between items-end">
                                                                                        <div className="flex flex-col">
                                                                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1">Planned / Total</span>
                                                                                            <div className="flex items-baseline gap-1.5">
                                                                                                <span className="text-3xl font-black leading-none tracking-tighter text-indigo-400">{p}</span>
                                                                                                <span className="text-sm font-bold text-slate-500">/ {t}</span>
                                                                                            </div>
                                                                                        </div>
                                                                                        <div className="text-right flex flex-col">
                                                                                            <span className="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-1">Available</span>
                                                                                            <span className={`text-xl font-black leading-none ${isLow ? 'text-rose-400' : 'text-emerald-400'}`}>{avail}</span>
                                                                                        </div>
                                                                                    </div>
                                                                                    
                                                                                    <div className="w-full bg-slate-950/60 rounded-full h-2.5 border border-slate-800 overflow-hidden flex shadow-inner">
                                                                                        <div className="h-full bg-indigo-500 transition-all duration-700 shadow-[0_0_10px_rgba(99,102,241,0.5)]" style={{ width: `${pct}%` }}></div>
                                                                                    </div>
                                                                                </div>
                                                                            );
                                                                        })()}
                                                                    </div>
                                                                    {(() => {
                                                                        const t = parseInt(item.total) || 0;
                                                                        const p = parseInt(item.planned) || 0;
                                                                        const avail = Math.max(0, t - p);
                                                                        return <div className={`absolute -bottom-12 -right-12 w-40 h-40 blur-3xl opacity-[0.06] rounded-full pointer-events-none transition-colors duration-500 ${avail > 0 ? 'bg-emerald-500' : 'bg-rose-500'}`}></div>;
                                                                    })()}
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <div className="flex items-center gap-4">
                                                                        <span className="font-black text-slate-100 text-sm tracking-wide leading-tight break-words" title={item.name}>{item.name}</span>
                                                                        {item.phone && <span className="text-xs text-slate-400 font-mono bg-slate-900 px-2 py-1 rounded border border-slate-700">📞 {item.phone}</span>}
                                                                    </div>
                                                                    {isMasterEditing && (
                                                                        <div data-master-screenshot-ignore="true" className="flex items-center gap-1">
                                                                            <button onClick={() => startEditingMasterItem(item)} className="text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/30 p-1.5 rounded transition-colors cursor-pointer" title="Edit"><Edit3 className="w-4 h-4" /></button>
                                                                            <button onClick={() => removeMasterListItem(item.id)} className="text-slate-500 hover:text-rose-400 hover:bg-rose-900/30 p-1.5 rounded transition-colors cursor-pointer" title="Delete"><Trash2 className="w-4 h-4" /></button>
                                                                        </div>
                                                                    )}
                                                                </>
                                                            )}
                                                        </>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {masterActiveTab === 'contractors' && (
                                        <div className="mt-8 relative overflow-hidden bg-slate-900 border border-slate-700/60 rounded-2xl p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 shadow-2xl">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-slate-500 to-transparent opacity-40"></div>
                                            
                                            <div className="flex items-center gap-4 z-10">
                                                <div className="flex items-center justify-center">
                                                    <Truck className="w-10 h-10 text-slate-200" />
                                                </div>
                                                <div>
                                                    <h3 className="text-xl font-black text-white tracking-tight">Network Fleet Status</h3>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Aggregated Contractor Capacity</p>
                                                </div>
                                            </div>
                                            
                                            <div className="flex flex-wrap lg:flex-nowrap bg-slate-950/50 p-2 rounded-xl border border-slate-800/80 z-10 gap-1 w-full lg:w-auto">
                                                {(() => {
                                                    const fleet = masterLists.contractors || [];
                                                    const totalFleet = fleet.reduce((sum, c) => sum + (parseInt(c.total) || 0), 0);
                                                    const plannedFleet = fleet.reduce((sum, c) => sum + (parseInt(c.planned) || 0), 0);
                                                    const availFleet = Math.max(0, totalFleet - plannedFleet);
                                                    return (
                                                        <>
                                                            <div className="flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center">
                                                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1">Total Fleet</span>
                                                                <span className="text-2xl font-black text-white leading-none">{totalFleet}</span>
                                                            </div>
                                                            <div className="hidden lg:block w-px bg-slate-800 my-2"></div>
                                                            <div className="flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center bg-slate-800/60 border border-slate-600/40">
                                                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-1">Assigned</span>
                                                                <span className="text-2xl font-black text-slate-200 leading-none">{plannedFleet}</span>
                                                            </div>
                                                            <div className="hidden lg:block w-px bg-slate-800 my-2"></div>
                                                            <div className={`flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center border ${availFleet > 0 ? 'bg-emerald-900/10 border-emerald-500/10' : 'bg-rose-900/10 border-rose-500/10'}`}>
                                                                <span className={`text-[9px] font-black uppercase tracking-widest mb-1 ${availFleet > 0 ? 'text-emerald-500' : 'text-rose-500'}`}>Standby</span>
                                                                <span className={`text-2xl font-black leading-none ${availFleet > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{availFleet}</span>
                                                            </div>
                                                        </>
                                                    );
                                                })()}
                                            </div>
                                        </div>
                                    )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {isAdminUser && recordToDelete && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex items-center gap-3 text-rose-400 mb-4"><AlertTriangle className="w-6 h-6" /><h3 className="text-lg font-black">Confirm Deletion</h3></div>
                                <p className="text-sm text-slate-300 mb-6">Are you sure you want to delete the data for <span className="font-bold text-white">{recordToDelete}</span>? This action cannot be undone.</p>
                                <div className="flex gap-3 justify-end">
                                    <button onClick={() => setRecordToDelete(null)} className="px-4 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer">Cancel</button>
                                    <button onClick={async () => { if(!db) return; await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyRecaps', recordToDelete)); setRecordToDelete(null); if(activeDate === recordToDelete) setData(DEFAULT_DATA); }} className="px-4 py-2 rounded-lg font-bold text-sm bg-rose-600 text-white hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/40 cursor-pointer">Delete Record</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
