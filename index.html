        (() => {
            // Keep phone overlays above the software keyboard and browser chrome.
            const phoneQuery = window.matchMedia('(max-width: 767px), (max-width: 1023px) and (pointer: coarse)');
            const updatePhoneViewport = () => {
                const style = document.documentElement.style;
                if (!phoneQuery.matches) {
                    style.removeProperty('--phone-viewport-height');
                    style.removeProperty('--phone-viewport-top');
                    return;
                }
                const viewport = window.visualViewport;
                style.setProperty('--phone-viewport-height', `${viewport?.height || window.innerHeight}px`);
                style.setProperty('--phone-viewport-top', `${viewport?.offsetTop || 0}px`);
            };
            updatePhoneViewport();
            window.addEventListener('resize', updatePhoneViewport, { passive: true });
            window.visualViewport?.addEventListener('resize', updatePhoneViewport, { passive: true });
            window.visualViewport?.addEventListener('scroll', updatePhoneViewport, { passive: true });
            let dashboardScrollTimer;
            const showDashboardScrollbar = () => {
                document.documentElement.classList.add('show-dashboard-scrollbar');
                window.clearTimeout(dashboardScrollTimer);
                dashboardScrollTimer = window.setTimeout(() => {
                    document.documentElement.classList.remove('show-dashboard-scrollbar');
                }, 900);
            };
            document.addEventListener('scroll', showDashboardScrollbar, true);
            window.addEventListener('wheel', showDashboardScrollbar, { passive: true });
            window.addEventListener('touchmove', showDashboardScrollbar, { passive: true });
            window.addEventListener('keydown', (event) => {
                if (['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(event.key)) {
                    showDashboardScrollbar();
                }
            });
        })();
    </script>

            const a = (str1 || '').toLowerCase();
            const b = (str2 || '').toLowerCase();
            if (a === b) return 0;
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(

                    <button type="button" disabled={!canSend || sending} aria-label="Attach file" title="Attach a file up to 500 KB" onClick={() => fileInputRef.current?.click()} className="flex h-10 w-8 shrink-0 items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white disabled:opacity-40"><Paperclip className="h-5 w-5" /></button>
                    <textarea ref={inputRef} aria-label="Team message" disabled={!canSend || sending || Boolean(selectedSticker)} value={selectedSticker ? '' : draft} onChange={event => changeDraft(event.target.value)} onBlur={stopTyping} onKeyDown={event => { if (event.key === 'Enter' && !event.shiftKey && !event.nativeEvent.isComposing) { event.preventDefault(); send(); } }} rows="2" placeholder={selectedSticker ? 'Sticker ready to send' : 'Write a team message...'} className="min-h-[42px] min-w-0 flex-1 resize-none rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-xs font-semibold text-slate-100 outline-none focus:border-indigo-500 disabled:opacity-60" />
                    <button type="button" onClick={send} disabled={!canSend || sending || (!draft.trim() && !selectedSticker && !selectedFile)} className="rounded-xl bg-indigo-600 px-3 py-2.5 text-xs font-black uppercase tracking-widest text-white shadow-lg shadow-indigo-950/30 transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-40">{sending ? 'Sending…' : 'Send'}</button>
                </div>
            </div>;
        };

        // Small staggered bursts stay around the ring, with no animation work between sessions.
        const RING_FIREWORK_BURSTS = [
            { x: 50, y: 9, color: '#fbbf24', delay: 0 },
            { x: 91, y: 50, color: '#7dd3fc', delay: .9 },
            { x: 50, y: 91, color: '#c4b5fd', delay: 1.8 },
            { x: 9, y: 50, color: '#fda4af', delay: 2.7 }
        ];
        const MetricRingFireworks = ({ strength }) => <div className="metric-ring-fireworks" aria-hidden="true" data-html2canvas-ignore="true">
            {RING_FIREWORK_BURSTS.map((burst, index) => <span key={index} className="metric-ring-firework" style={{ left: `${burst.x}%`, top: `${burst.y}%`, '--burst-color': burst.color, '--burst-delay': `${burst.delay}s` }}>
                {Array.from({ length: 12 }, (_, spark) => {
                    const angle = spark * Math.PI / 6, distance = (10 + strength * .3) * (spark % 2 ? .7 : 1);
                    return <span key={spark} className="metric-ring-spark" style={{ '--spark-x': `${Math.cos(angle) * distance}px`, '--spark-y': `${Math.sin(angle) * distance + 4}px` }} />;
                })}
            </span>)}
        </div>;
        const MetricRingVisual = ({ settings, moving, percentage, displayValue, colors, preview = false }) => {
            const glow = settings.enabled && settings.glowStrength > 0 ? settings.glowMode : 'off';
            return <div className="metric-ring-visual relative w-32 h-32 z-10 flex items-center justify-center" style={ringVisualProperties(settings)}
                data-ring-glow={glow} data-ring-motion={settings.enabled && moving ? settings.motion : 'none'} data-ring-hover={settings.enabled ? settings.hoverEffect : 'none'}>
                <div className="metric-ring-motion absolute inset-0">
                    <svg aria-hidden="true" className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" className={`metric-ring-track stroke-current ${colors.text} opacity-20`} strokeWidth="6" fill="transparent" />
                        <circle cx="50" cy="50" r="40" className={`metric-ring-stroke stroke-current ${colors.ring} transition-all duration-1000 ease-out`} style={preview && glow === 'pulse' ? { animationDelay: `${-settings.glowInterval * .55}s` } : undefined} strokeWidth="6" fill="transparent" strokeDasharray={251.2} strokeDashoffset={251.2 - (251.2 * Math.max(0, Math.min(100, percentage || 0))) / 100} strokeLinecap="round" />
                    </svg>
                </div>
                {settings.enabled && moving && settings.motion === 'fireworks' && settings.motionStrength > 0 && <MetricRingFireworks strength={settings.motionStrength} />}
                <span className={`metric-ring-value text-lg md:text-xl font-bold tracking-tight z-10 ${colors.text}`}>{displayValue}</span>
            </div>;
        };
        const DashboardRingSettings = ({ settings, change, save, discard, busy, loaded, dirty }) => {
            const [previewRun, setPreviewRun] = useState(0);
            const moving = useMetricRingMotion(settings, previewRun, true);
            const preset = DASHBOARD_RING_PRESETS.find(item => sameSavedValue(item.settings, settings))?.id || 'custom';
            const disabled = busy || !loaded;
            const fieldClass = 'mt-1 w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-sm font-normal text-slate-100';
            const warmth = settings.temperature === 0 ? 'Neutral' : settings.temperature < 0 ? 'Cool' : 'Warm';
            return <section aria-label="Ring settings" className="space-y-5">
                <div><h3 className="font-bold text-white">Rings</h3><p className="text-xs text-slate-400 mt-1">Try a look in the preview, then save it for the whole team. Only you can change these settings.</p></div>
                <div className="grid gap-5 lg:grid-cols-[15rem_minmax(0,1fr)]">
                    <div className="space-y-3 min-w-0">
                        <div className="metric-ring-card rounded-xl border border-slate-700 bg-slate-800/40 p-5 flex flex-col items-center gap-3" aria-label="Ring preview">
                            <span className="text-xs font-bold uppercase tracking-widest text-slate-400">Live preview</span>
                            <MetricRingVisual key={previewRun} settings={settings} moving={moving} percentage={99.06} displayValue="99.06%" colors={{text:'text-emerald-400',ring:'text-emerald-500'}} preview />
                            <span className="text-xs text-slate-400">{settings.enabled ? `${settings.glowMode === 'off' ? 'No glow' : settings.glowMode === 'steady' ? 'Steady glow' : 'Pulsing glow'} · ${warmth}` : 'Effects off'}</span>
                        </div>
                        <button type="button" aria-label="Preview ring movement" disabled={disabled || !settings.enabled || settings.motion === 'none' || settings.motionStrength === 0} onClick={() => setPreviewRun(run => run + 1)} className="w-full rounded-lg border border-slate-600 px-3 py-2 text-xs font-bold text-slate-200 hover:bg-slate-800 disabled:opacity-40">Preview movement · 6 seconds</button>
                        {moving && <button type="button" onClick={() => setPreviewRun(0)} className="w-full text-xs text-slate-400 underline underline-offset-2">Stop preview</button>}
                        <p className="text-xs text-slate-400">Temperature changes the glow color. Your metric scores keep their original colors.</p>
                    </div>
                    <div className="space-y-4 min-w-0">
                        <div className="rounded-xl border border-slate-700 bg-slate-800/40 p-4 space-y-4">
                            <label className="flex items-center justify-between gap-3 text-sm font-bold text-slate-200">Ring effects<input type="checkbox" aria-label="Enable ring effects" disabled={disabled} checked={settings.enabled} onChange={event => change({...settings,enabled:event.target.checked})} className="h-5 w-5 shrink-0 accent-emerald-500" /></label>
                            <label className="block text-xs font-bold text-slate-300">Choose a look<select aria-label="Ring look preset" disabled={disabled} value={preset} onChange={event => change({...DASHBOARD_RING_PRESETS.find(item => item.id === event.target.value).settings})} className={fieldClass}><option value="custom" disabled>Custom look</option>{DASHBOARD_RING_PRESETS.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}</select></label>
                            <button type="button" disabled={disabled} onClick={() => change({...settings,enabled:true,motion:'none',glowMode:settings.glowMode === 'off' ? 'off' : 'steady',hoverEffect:'none'})} className="rounded-lg border border-slate-600 px-3 py-2 text-xs font-semibold text-slate-200">Make rings steady</button>
                        </div>
                        <fieldset disabled={disabled || !settings.enabled} className="rounded-xl border border-slate-700 bg-slate-800/40 p-4 space-y-4 disabled:opacity-50">
                            <legend className="px-1 text-sm font-bold text-slate-200">Glow</legend>
                            <div className="grid gap-3 sm:grid-cols-2">
                                <label className="text-xs font-bold text-slate-300">Glow mode<select aria-label="Ring glow mode" value={settings.glowMode} onChange={event => change({...settings,glowMode:event.target.value})} className={fieldClass}><option value="off">Off</option><option value="pulse">Slow pulse</option><option value="steady">Steady glow</option></select></label>
                                <label className="text-xs font-bold text-slate-300">Glow style<select aria-label="Ring glow style" value={settings.glowStyle} onChange={event => change({...settings,glowStyle:event.target.value})} className={fieldClass}><option value="soft">Soft halo</option><option value="neon">Neon</option><option value="wide">Wide halo</option></select></label>
                            </div>
                            <label className="block text-xs font-bold text-slate-300">Glow strength: {settings.glowStrength}%<input aria-label="Ring glow strength" type="range" min="0" max="100" step="5" value={settings.glowStrength} onInput={event => change({...settings,glowStrength:Number(event.currentTarget.value)})} className="mt-3 w-full accent-emerald-400" /></label>
                            <label className="block text-xs font-bold text-slate-300">Glow temperature: {warmth} {settings.temperature === 0 ? '' : `${Math.abs(settings.temperature)}%`}<input aria-label="Ring glow temperature" type="range" min="-100" max="100" step="5" value={settings.temperature} onInput={event => change({...settings,temperature:Number(event.currentTarget.value)})} className="mt-3 w-full accent-amber-400" /><span className="flex justify-between text-[10px] font-normal text-slate-500 mt-1"><span>Cool</span><span>Neutral</span><span>Warm</span></span></label>
                            <label className="block text-xs font-bold text-slate-300">Pulse every {settings.glowInterval} seconds<input aria-label="Ring glow pulse interval" disabled={settings.glowMode !== 'pulse'} type="range" min="5" max="60" step="5" value={settings.glowInterval} onInput={event => change({...settings,glowInterval:Number(event.currentTarget.value)})} className="mt-3 w-full accent-indigo-400 disabled:opacity-40" /></label>
                        </fieldset>
                        <fieldset disabled={disabled || !settings.enabled} className="rounded-xl border border-slate-700 bg-slate-800/40 p-4 space-y-4 disabled:opacity-50">
                            <legend className="px-1 text-sm font-bold text-slate-200">Movement</legend>
                            <label className="block text-xs font-bold text-slate-300">Movement style<select aria-label="Ring movement style" value={settings.motion} onChange={event => change({...settings,motion:event.target.value})} className={fieldClass}><option value="none">Off / Steady</option><option value="dance">Dance</option><option value="bounce">Bounce</option><option value="float">Float</option><option value="sway">Sway</option><option value="fireworks">Fireworks</option></select></label>
                            {settings.motion === 'fireworks' && <p className="text-xs text-slate-400">Colorful bursts around each ring. Strength controls their size; the interval and duration below control when they appear.</p>}
                            <fieldset disabled={settings.motion === 'none'} className="space-y-4 disabled:opacity-40">
                                <label className="block text-xs font-bold text-slate-300">Movement strength: {settings.motionStrength}%<input aria-label="Ring movement strength" type="range" min="0" max="100" step="5" value={settings.motionStrength} onInput={event => change({...settings,motionStrength:Number(event.currentTarget.value)})} className="mt-3 w-full accent-indigo-400" /></label>
                                <label className="block text-xs font-bold text-slate-300">Repeat every {settings.motionInterval === 60 ? '1 hour' : `${settings.motionInterval} minutes`}<input aria-label="Ring movement repeat interval" type="range" min="1" max="120" step="1" value={settings.motionInterval} onInput={event => change({...settings,motionInterval:Number(event.currentTarget.value)})} className="mt-3 w-full accent-indigo-400" /></label>
                                <label className="block text-xs font-bold text-slate-300">Move for {settings.motionDuration} seconds<input aria-label="Ring movement duration" type="range" min="5" max="60" step="5" value={settings.motionDuration} onInput={event => change({...settings,motionDuration:Number(event.currentTarget.value)})} className="mt-3 w-full accent-indigo-400" /></label>
                            </fieldset>
                            <label className="block text-xs font-bold text-slate-300">Mouse hover<select aria-label="Ring hover effect" value={settings.hoverEffect} onChange={event => change({...settings,hoverEffect:event.target.value})} className={fieldClass}><option value="none">Off / Steady</option><option value="highlight">Highlight score</option><option value="expand">Expand ring</option></select></label>
                        </fieldset>
                    </div>
                </div>
                <div className="flex flex-wrap items-center gap-3"><button type="button" onClick={save} disabled={disabled || !dirty} className="rounded-lg bg-emerald-600 px-4 py-2 text-xs font-bold text-white disabled:opacity-40">{busy ? 'Saving…' : 'Save ring settings'}</button><button type="button" disabled={disabled} onClick={() => change(defaultDashboardRingSettings())} className="rounded-lg border border-slate-600 px-4 py-2 text-xs font-bold text-slate-300">Restore original look</button><button type="button" disabled={disabled || !dirty} onClick={discard} className="rounded-lg border border-slate-600 px-4 py-2 text-xs font-bold text-slate-300">Discard ring changes</button></div>
                <p className="text-xs text-slate-400">The dashboard starts counting the movement interval when Overview opens or saved movement settings change. Devices set to reduced motion keep the rings still.</p>
            </section>;
        };

        const TaskDeadlinePicker = ({ value, onChange, disabled }) => {
            const [date = '', time = ''] = (value || '').split('T');
            const [open, setOpen] = useState(false);
            const [monthKey, setMonthKey] = useState(() => date.slice(0, 7) || taskDueInput(new Date().toISOString()).slice(0, 7));
            const pickerRef = useRef(null), triggerRef = useRef(null);
            const closeCalendar = () => {
                setOpen(false);
                requestAnimationFrame(() => triggerRef.current?.focus({ preventScroll: true }));
            };
            useEffect(() => {
                if (!open) return;
                const outside = event => { if (!pickerRef.current?.contains(event.target)) setOpen(false); };
                // Close this picker before the task window's Escape handler runs.
                const keyboard = event => {
                    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); closeCalendar(); }
                };
                document.addEventListener('pointerdown', outside);
                document.addEventListener('keydown', keyboard, true);
                return () => { document.removeEventListener('pointerdown', outside); document.removeEventListener('keydown', keyboard, true); };
            }, [open]);
            useEffect(() => { if (disabled) setOpen(false); }, [disabled]);
            const monthBase = new Date(`${monthKey}-01T12:00:00`);
            const year = monthBase.getFullYear(), month = monthBase.getMonth();
            const monthLabel = monthBase.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            const cells = Array.from({ length: new Date(year, month, 1).getDay() }, () => null);
            for (let day = 1; day <= new Date(year, month + 1, 0).getDate(); day++) cells.push(day);
            while (cells.length % 7 !== 0) cells.push(null);
            const changeMonth = offset => {
                const next = new Date(year, month + offset, 1, 12);
                setMonthKey(`${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}`);
            };
            return <fieldset className="min-w-0" disabled={disabled}>
                <legend className="text-xs font-semibold text-slate-300">Deadline (Central time)</legend>
                <div ref={pickerRef} className="mt-2">
                    <div className="grid grid-cols-[minmax(0,1fr)_7rem] gap-2">
                        <div className="min-w-0"><span className="block mb-1 text-xs text-slate-400">Date</span><button ref={triggerRef} type="button" aria-label="Choose task deadline date" aria-expanded={open} aria-controls="task-deadline-calendar" onClick={() => {
                            if (!open) setMonthKey(date.slice(0, 7) || taskDueInput(new Date().toISOString()).slice(0, 7));
                            setOpen(current => !current);
                        }} className="flex w-full min-w-0 items-center gap-2 rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-sm text-slate-100 hover:border-slate-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-slate-400"><Calendar aria-hidden="true" className="h-4 w-4 shrink-0 text-slate-400" /><span className="truncate">{date ? new Date(date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Choose date'}</span></button></div>
                        <label className="block min-w-0 text-xs text-slate-400">Time<input aria-label="Task deadline time in Central time" type="time" style={{ colorScheme: 'dark' }} required value={time} onInput={event => onChange(date + 'T' + event.currentTarget.value)} className="mt-1 w-full min-w-0 rounded-lg border border-slate-600 bg-slate-950 px-2 py-2 text-sm text-slate-100 focus:outline-none focus:border-slate-400" /></label>
                    </div>
                    {open && <div id="task-deadline-calendar" role="group" aria-label="Task deadline calendar" className="mt-2 w-64 max-w-full rounded-xl border border-slate-700 bg-slate-900 shadow-2xl p-3 text-slate-200">
                        <div className="flex items-center justify-between mb-3">
                            <button type="button" aria-label="Previous deadline month" onClick={() => changeMonth(-1)} className="px-2 py-1 text-slate-400 hover:text-white transition-colors cursor-pointer">‹</button>
                            <div aria-live="polite" className="text-xs font-black uppercase tracking-widest text-slate-200">{monthLabel}</div>
                            <button type="button" aria-label="Next deadline month" onClick={() => changeMonth(1)} className="px-2 py-1 text-slate-400 hover:text-white transition-colors cursor-pointer">›</button>
                            <button type="button" aria-label="Close task deadline calendar" onClick={closeCalendar} className="p-1 text-slate-400 hover:text-white"><X className="h-4 w-4" /></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1 text-center text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1">{['S','M','T','W','T','F','S'].map((day, index) => <div key={index} className="py-1">{day}</div>)}</div>
                        <div className="grid grid-cols-7 gap-1">{cells.map((day, index) => {
                            if (!day) return <div key={'empty-' + index} className="h-9 sm:h-7" />;
                            const cellDate = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                            return <button key={cellDate} type="button" aria-label={new Date(cellDate + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} aria-pressed={cellDate === date} onClick={() => { onChange(cellDate + 'T' + time); closeCalendar(); }} className={`h-9 sm:h-7 text-[10px] font-bold rounded-md transition-colors cursor-pointer ${cellDate === date ? 'bg-slate-700 text-white border border-slate-500' : 'text-slate-300 hover:bg-slate-800 hover:text-white border border-transparent'}`}>{day}</button>;
                        })}</div>
                    </div>}
                </div>
            </fieldset>;
        };

        const TeamTasksWindow = ({ dialogRef, close, owner, uid, loaded, busy, error, message, tasks, assignees, notifications, readAlert,
            filter, setFilter, person, setPerson, selectedId, selectTask, draft, setDraft, startDraft, commit, updates, setUpdates, requests, setRequests }) => {
            const filtered = owner ? tasks.filter(task => (filter === 'all' || (filter === 'active' ? task.status !== 'completed' : task.status === filter)) && (!person || isTaskAssignedTo(task, person))) : tasks.filter(task => task.id === selectedId && isTaskAssignedTo(task, uid));
            const draftAccounts = draft ? [...assignees, ...(draft.assignedUids || []).filter(id => !assignees.some(account => account.uid === id)).map(id => ({ uid: id, name: getTaskAssignedName(draft.baseline || {}, id), inactive: true }))] : [];
            const fieldClass = 'w-full rounded-lg border border-slate-600 bg-slate-950 px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-400';
            const eventLabels = { assigned: 'Assignment', edited: 'Details updated', status: 'Progress', 'update-request': 'Update requested', update: 'Update' };
            const statusClass = status => status === 'completed' ? 'text-emerald-300' : status === 'in-progress' ? 'text-amber-300' : 'text-slate-300';
            return <div className="dashboard-modal settings-modal fixed inset-0 z-[125] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4" data-dashboard-edit-ignore="true" data-html2canvas-ignore="true">
                <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby="team-tasks-title" className="settings-window flex flex-col min-h-0 w-full max-w-4xl max-h-[90dvh] rounded-2xl border border-slate-700 bg-slate-900 shadow-2xl overflow-hidden">
                    <div className="dashboard-mobile-toolbar flex items-center justify-between gap-3 border-b border-slate-700 bg-slate-800 px-5 py-4 shrink-0">
                        <div className="min-w-0"><h2 id="team-tasks-title" className="text-lg font-black text-white">{owner ? 'Team Tasks' : 'Your Assignment'}</h2><p className="text-xs text-slate-400">{owner ? 'Assignments, progress, and follow-ups · Deadlines in Central time' : 'Update your progress or reply to Fadi · Deadline in Central time'}</p></div>
                        <button type="button" data-tasks-close aria-label={owner ? 'Close Team Tasks' : 'Close Assignment'} onClick={close} disabled={busy} className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 disabled:opacity-40"><X className="w-5 h-5" /></button>
                    </div>
                    <div className="dashboard-scroll-area settings-content min-h-0 flex-1 overflow-y-auto overscroll-contain p-4 sm:p-5 space-y-4">
                        {error && <div role="alert" className="rounded-xl border border-rose-500/30 bg-rose-950/20 p-3 text-sm text-rose-200 break-words">{error}</div>}
                        {message && <div role="status" className="rounded-xl border border-emerald-500/30 bg-emerald-950/20 p-3 text-sm text-emerald-200">{message}</div>}
                        {!loaded && !error && <p className="text-sm text-slate-400">Loading assignments…</p>}
                        {owner && notifications.length > 0 && <section aria-label="Your task alerts" className="rounded-xl border border-rose-500/30 p-3 space-y-2">
                            <h3 className="text-sm font-bold text-rose-300">Your task alerts ({notifications.length})</h3>
                            {notifications.map(event => <div key={event.id} className="flex items-start gap-2"><button type="button" disabled={busy} onClick={() => { selectTask(event.taskId); setFilter('all'); setPerson(''); readAlert([event.id]); }} className="block min-w-0 flex-1 text-left rounded-lg bg-slate-800/60 hover:bg-slate-800 px-3 py-2 text-sm">
                                <span className="block font-bold text-slate-100">{event.author}: {eventLabels[event.type]} — {event.title}</span><span className="block mt-1 text-slate-400 break-words whitespace-pre-wrap">{event.text}</span><span className="block mt-1 text-xs text-slate-500">{formatTaskTime(event.timestamp)}</span>
                            </button><button type="button" disabled={busy} onClick={() => readAlert([event.id])} aria-label={'Dismiss alert for ' + event.title} className="shrink-0 rounded-lg border border-slate-600 px-3 py-2 text-xs text-slate-300 hover:bg-slate-800 disabled:opacity-40">Dismiss</button></div>)}
                        </section>}
                        {owner && <div className="flex flex-wrap items-end justify-between gap-3">
                            <div className="flex flex-wrap gap-3 min-w-0">
                                <label className="text-xs font-semibold text-slate-300">Show<select aria-label="Task status filter" value={filter} onChange={event => setFilter(event.target.value)} className={fieldClass + ' mt-1'}><option value="active">Active tasks</option><option value="open">Open</option><option value="in-progress">In Progress</option><option value="completed">Completed</option><option value="all">All tasks</option></select></label>
                                <label className="text-xs font-semibold text-slate-300">Assigned to<select aria-label="Task person filter" value={person} onChange={event => setPerson(event.target.value)} className={fieldClass + ' mt-1'}><option value="">Everyone</option>{[...new Map([...assignees, ...tasks.flatMap(task => getTaskAssignedUids(task).map(id => ({ uid: id, name: getTaskAssignedName(task, id) })))].map(account => [account.uid, account])).values()].map(account => <option key={account.uid} value={account.uid}>{account.name}</option>)}</select></label>
                            </div>

                updatePresence();

                const presenceCol = collection(db, 'artifacts', appId, 'public', 'data', 'presence');

                    const now = Date.now();
                    const threshold = now - offlineAfterMs; 
                    snapshot.forEach(doc => { 
                        const presence = doc.data();
                        if (presence.chatTypingUntil) typingSessions.push(presence);
                        const lastSeen = Number(presence.lastSeen || presence.lastActive || 0);
                        if (lastSeen > threshold) {
                            const hiddenSince = Number(presence.hiddenSince || 0);
                            const inferredStatus = hiddenSince
                                ? (now - hiddenSince >= PRESENCE_AWAY_AFTER_MS ? 'away' : 'idle')
                                : 'active';
                            const sessionPresence = {
                                ...presence,
                                status: presence.hiddenSince ? inferredStatus : (presence.status || inferredStatus)
                            };
                            const uid = sessionPresence.uid || doc.id;
                            const existing = byUser.get(uid);
                            const rank = { active: 3, idle: 2, away: 1 };
                            const existingStatusRank = existing ? rank[existing.status] || 0 : 0;
                            const sessionStatusRank = rank[sessionPresence.status] || 0;
                            if (!existing || sessionStatusRank > existingStatusRank || (sessionStatusRank === existingStatusRank && lastSeen > Number(existing.lastSeen || 0))) {
                                byUser.set(uid, {
                                    ...existing,
                                    ...sessionPresence,
                                    uid,

            const isDashboardBackgroundEvent = (event, allowDoubleClickSelection = false) => {

                    const suVal = cols[2] || '';

                    let lastFirstName = '';
                    let lastLastName = '';
                    let lastType = '';
                    
                    for (let i = 0; i < fRows.length; i++) {

                            if (currentFeedback) fParsedData.push(currentFeedback);
                            
                            // Get raw values, use tracking variable if blank
                            const rawDate = cols[0]?.trim();
                            const rawFirstName = cols[1]?.trim();
                            const rawLastName = cols[2]?.trim();
                            const rawType = cols[3]?.trim();
                            
                            if (rawDate) lastDate = rawDate;
                            if (rawFirstName) lastFirstName = rawFirstName;
                            if (rawLastName) lastLastName = rawLastName;
                            if (rawType) lastType = rawType;
                            
                            currentFeedback = {
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 5) + i,
                                date: lastDate,
                                firstName: lastFirstName,
                                lastName: lastLastName,
                                type: lastType,
                                score: !isNaN(possibleScore) ? possibleScore : 0,
                                orderNum: cols[5]?.trim(),
                                comment: (cols.slice(6).join('\t') || '').replace(/^"|"$/g, '').trim()
                            };
                        } else if (currentFeedback && rowText.trim() !== '') {
                            currentFeedback.comment += (currentFeedback.comment ? '\n' : '') + rowText.trim().replace(/^"|"$/g, '');
                        }
                    }
                    if (currentFeedback) fParsedData.push(currentFeedback);

                    if (e.target) e.target.value ="";

                    if (fParsedData.length > 0) {
                        const nd = JSON.parse(JSON.stringify(data));
                        if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                        if (!nd.metricsTracker.feedback) nd.metricsTracker.feedback = [];
                        nd.metricsTracker.feedback = [...nd.metricsTracker.feedback, ...fParsedData];
                        setData(nd);
                        setPasteFeedback(`✅ Successfully extracted ${fParsedData.length} feedback reviews!`);
                    } else {
                        setPasteFeedback(`❌ Could not detect feedback data.`);
                    }
                    setTimeout(() => setPasteFeedback(''), 5000);
                    return; 
                }

                const mRows = text.split(/\r?\n/).map(r => r.trim()).filter(r => r);
                const mParsedData = [];
                let foundTotals = null;

                for (const row of mRows) {
                    const cols = row.split('\t').map(c => c.trim());
                    const rawStr = row.toLowerCase();
                    
                    if (rawStr.includes('minimum target') || rawStr.includes('driverkey') || rawStr.includes('max. driver')) continue;

                    const nums = cols.map(c => c.replace(/[^0-9.-]/g, '')).filter(c => c !== '').map(Number);
                    if (rawStr.includes('grand total') || rawStr.includes('total') || (cols[0] === '' && cols[1] === '' && nums.length >= 4)) {
                        if (nums.length >= 4) {
                            foundTotals = {
                                surveyCnt: nums[nums.length - 5] || 0,
                                surveyAvg: nums[nums.length - 4] || 0,
                                onTime: nums[nums.length - 3] || 0,
                                completion: nums[nums.length - 2] || 0,
                                exchange: nums[nums.length - 1] || 0
                            };
                        }
                        continue;
                    }

                    if (cols.length < 4) continue;

                    let offset = /^\d+/.test(cols[0]) ? 0 : -1;
                    const parseNum = (val) => parseFloat((val || '').replace(/[^0-9.-]/g, '')) || 0;

                    const firstName = cols[1 + offset] || '';
                    const lastName = cols[2 + offset] || '';
                    if (!firstName && !lastName) continue;

                    mParsedData.push({
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        firstName: firstName,
                        lastName: lastName,
                        surveyCnt: parseInt(parseNum(cols[3 + offset]), 10) || 0,
                        surveyAvg: parseNum(cols[4 + offset]),
                        onTime: parseNum(cols[5 + offset]),
                        completion: parseNum(cols[6 + offset]),
                        exchange: parseNum(cols[7 + offset])
                    });
                }

                if (e.target) e.target.value ="";

                if (mParsedData.length > 0) {
                    const nd = JSON.parse(JSON.stringify(data));
                    if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                    
                    const existing = nd.metricsTracker[metricsSubTab] || [];
                    mParsedData.forEach(newRow => {
                        const matchIdx = existing.findIndex(r => r.firstName === newRow.firstName && r.lastName === newRow.lastName);
                        if (matchIdx >= 0) existing[matchIdx] = newRow;
                        else existing.push(newRow);
                    });
                    nd.metricsTracker[metricsSubTab] = existing;

                    if (foundTotals) {
                        nd.metricsTracker[`${metricsSubTab}Totals`] = foundTotals;
                    } else if (nd.metricsTracker[`${metricsSubTab}Totals`]) {
                        delete nd.metricsTracker[`${metricsSubTab}Totals`];
                    }

                    setData(nd);
                    setPasteFeedback(`✅ Successfully updated ${mParsedData.length} drivers!`);
                } else if (foundTotals) {
                    const nd = JSON.parse(JSON.stringify(data));
                    if (!nd.metricsTracker) nd.metricsTracker = { wtd: [], mtd: [], feedback: [] };
                    nd.metricsTracker[`${metricsSubTab}Totals`] = foundTotals;
                    setData(nd);
                    setPasteFeedback(`✅ Only Totals were detected and updated.`);
                } else {
                    setPasteFeedback(`❌ Could not detect metrics data. Check format.`);
                }
                setTimeout(() => setPasteFeedback(''), 5000);
            };

            const calculateKPIs = (inputData) => {
                const d = inputData || DEFAULT_DATA;
                const autoRouteCounts = getAutoRouteCounts(d);
                const routes = autoRouteCounts.hasRows ? autoRouteCounts.routes : Number(d.loadout?.metrics?.[0]?.value) || 0;
                const sameDayRoutes = autoRouteCounts.hasRows ? autoRouteCounts.sameDayRoutes : Number(d.loadout?.metrics?.[1]?.value) || 0;
                const orders = autoRouteCounts.hasRows ? autoRouteCounts.orders : 0;
                const pickups = Number(d.endOfDay?.risk?.[2]?.value) || 0;
                const basicCount = Number(d.loadout?.basicDeliveryCount) || 0;
                const thresholdCount = Number(d.loadout?.thresholdCount) || 0;
                const whiteGloveCount = Number(d.loadout?.whiteGloveCount) || 0;
                const uniform = Math.min(Number(d.loadout?.uniformCount) || 0, routes);
                const offDock = Math.min(Number(d.loadout?.offDockCount) || 0, routes);
                const eta = Math.min(Number(d.loadout?.etaCount) || 0, routes);
                const comp = Math.min(Number(d.loadout?.completedRoutesCount) || 0, routes);
                const missedDeliv = Number(d.midDay?.metrics?.[2]?.value) || 0;
                const earlyViolations = Number(d.midDay?.earlyCount) || 0;
                const missedEta = Math.max(0, routes - eta);
                const incompleteRoutes = Math.max(0, routes - comp);
                const onTimeOrders = Math.max(0, orders - (missedEta + missedDeliv + earlyViolations + incompleteRoutes));
                const otd = orders > 0 ? (onTimeOrders / orders) * 100 : 0;
                const offDockPerc = routes > 0 ? (offDock / routes) * 100 : 0;
                const etaPerc = routes > 0 ? (eta / routes) * 100 : 0;
                const compPerc = routes > 0 ? (comp / routes) * 100 : 0;
                const uniformPerc = routes > 0 ? (uniform / routes) * 100 : 0;
                const executionScore = (uniformPerc + offDockPerc + etaPerc + compPerc + otd) / 5;
                
                const transitDamages = Number(d.loadout?.transitDamage) || 0;
                const damageRate = orders > 0 ? (transitDamages / orders) * 100 : 0;
                const escalations = Number(d.loadout?.escalations) || 0;
                const escPerc = orders > 0 ? Math.max(0, ((orders - escalations) / orders) * 100) : 0;
                const pods = Number(d.loadout?.podsReconciled) || 0;
                const podPerc = orders > 0 ? Math.min(100, (pods / orders) * 100) : 0;
                const notHome = Number(d.loadout?.customerNotHome) || 0;
                const notHomePerc = orders > 0 ? (notHome / orders) * 100 : 0;
                const claims = Number(d.loadout?.claimsOpen) || 0;
                const claimsPerc = orders > 0 ? (claims / orders) * 100 : 0;

                const checkedInCount = (d.routeTable || []).filter(r => r.checkedIn).length;
                const checkedInPerc = routes > 0 ? (checkedInCount / routes) * 100 : 0;

                return { 
                    otd, executionScore, damageRate, offDockPerc, etaPerc, compPerc, uniformPerc, 
                    routes, sameDayRoutes, orders, pickups, basicCount, thresholdCount, whiteGloveCount, missedDeliv, earlyViolations, escPerc, podPerc, notHomePerc, claimsPerc, checkedInCount, checkedInPerc 
                };
            };

            const currentKPI = calculateKPIs(data);

            const formatEditableZeroNumber = (value) => String(value || '0') === '0' ? '' : String(value);
            const parseEditableNumber = (value) => {
                const digits = String(value || '').replace(/\D/g, '');

            };
            const getTrends = () => {
                const activeDateObj = new Date(activeDate + 'T12:00:00');
                const yesterdayStr = new Date(activeDateObj.getTime() - 86400000).toISOString().split('T')[0];
                const yesterdayKPI = calculateKPIs(historyData.find(h => h.date === yesterdayStr));
                const last7Days = historyData.filter(h => {
                    const hDate = new Date(h.date + 'T12:00:00');
                    const diffDays = (activeDateObj - hDate) / (1000 * 60 * 60 * 24);
                    return diffDays >= 0 && diffDays < 7;
                });
                const wtdAvg = (key) => {
                    if (!last7Days.length) return 0;
                    const sum = last7Days.reduce((acc, curr) => acc + calculateKPIs(curr)[key], 0);
                    return sum / last7Days.length;
                };
                return { 
                    yesterday: yesterdayKPI, 
                    wtd: { 
                        otd: wtdAvg('otd'), executionScore: wtdAvg('executionScore'), damageRate: wtdAvg('damageRate'), 
                        offDockPerc: wtdAvg('offDockPerc'), etaPerc: wtdAvg('etaPerc'), compPerc: wtdAvg('compPerc'),
                        uniformPerc: wtdAvg('uniformPerc'), routes: wtdAvg('routes'), sameDayRoutes: wtdAvg('sameDayRoutes'), orders: wtdAvg('orders'),
                        pickups: wtdAvg('pickups'), basicCount: wtdAvg('basicCount'), thresholdCount: wtdAvg('thresholdCount'),
                        whiteGloveCount: wtdAvg('whiteGloveCount'), missedDeliv: wtdAvg('missedDeliv'), earlyViolations: wtdAvg('earlyViolations'),
                        escPerc: wtdAvg('escPerc'), podPerc: wtdAvg('podPerc'), notHomePerc: wtdAvg('notHomePerc'), claimsPerc: wtdAvg('claimsPerc'), checkedInPerc: wtdAvg('checkedInPerc')
                    } 
                };
            };
            const trends = getTrends();

            const filteredHistoryData = historyData.filter(h => {

                    return [

                    ];
                });
                const csvContent ="data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);

            const exportHistoryRoutesToCSV = () => {
                if (filteredHistoryData.length === 0) return;
                
                let hasRoutes = false;
                const headers = ['"Date"', ...ROUTE_COLUMNS.map(col => `"${col.label}"`)];

                filteredHistoryData.forEach(h => {

                                else if (col.type === 'time' && val) { val = formatTime(val); }

                if (!hasRoutes) return;

                else if (historyDateFrom) fileName += `_from_${historyDateFrom}`;
                else if (historyDateTo) fileName += `_to_${historyDateTo}`;

            const downloadPanelScreenshot = async (element, fileName) => {
                if (!window.html2canvas || !element || isCapturing) return;
                setIsCapturing(true);
                let screenshotClone = null;
                setTimeout(async () => {
                    try {
                        const isMasterPanel = element.matches('[data-master-screenshot-panel="true"]');
                        const isPreloadTable = element.matches('[data-preload-screenshot-table="true"]');
                        const baseWidth = Math.ceil(isMasterPanel
                            ? element.getBoundingClientRect().width
                            : Math.max(element.offsetWidth, element.scrollWidth, element.getBoundingClientRect().width));
                        screenshotClone = element.cloneNode(true);
                        screenshotClone.style.position = 'fixed';
                        screenshotClone.style.left = '-10000px';
                        screenshotClone.style.top = '0';
                        screenshotClone.style.width = `${baseWidth}px`;
                        if (isMasterPanel || isPreloadTable) screenshotClone.style.boxSizing = 'border-box';
                        screenshotClone.style.maxWidth = 'none';

                        prepareScreenshotSurface(screenshotClone);

                        screenshotClone.querySelectorAll('[data-panel-screenshot-ignore="true"], [data-master-screenshot-ignore="true"]').forEach(node => {

                        });
                        if (isPreloadTable) {

                            const liveControls = element.querySelectorAll('input, select, button');
                            screenshotClone.querySelectorAll('input, select, button').forEach((control, index) => {
                                const live = liveControls[index];
                                const label = document.createElement('div');
                                label.className = control.className;
                                label.textContent = live.tagName === 'SELECT'
                                    ? (live.selectedOptions[0]?.textContent || live.value || 'Unassigned')
                                    : live.tagName === 'INPUT' ? (live.value || '—') : live.textContent;
                                label.style.whiteSpace = 'normal';
                                label.style.overflowWrap = 'anywhere';
                                label.style.height = 'auto';
                                label.style.cursor = 'default';
                                control.replaceWith(label);
                            });
                        }
                        // The master panel's scrolling parent is outside this copy. Preserve

                        if (!isMasterPanel) screenshotClone.querySelectorAll('[class*="overflow"], [style*="overflow"], [class*="max-h"], [class*="h-full"], [class*="flex-1"], [class*="min-h-0"]').forEach(node => {
                            node.style.overflow = 'visible';

                        screenshotClone.querySelectorAll('table').forEach(table => {
                            table.style.width = '100%';
                        });
                        document.body.appendChild(screenshotClone);
                        await new Promise(resolve => requestAnimationFrame(resolve));
                        await new Promise(resolve => setTimeout(resolve, 80));
                        const captureRect = screenshotClone.getBoundingClientRect();
                        const captureWidth = Math.ceil(isMasterPanel || isPreloadTable
                            ? captureRect.width
                            : Math.max(screenshotClone.scrollWidth, captureRect.width, baseWidth));
                        const captureHeight = isMasterPanel || isPreloadTable
                            ? Math.ceil(captureRect.height)
                            : Math.ceil(Math.max(screenshotClone.scrollHeight, captureRect.height)) + 6;
                        await downloadScreenshotPng(screenshotClone, fileName, {
                            backgroundColor: isPreloadTable ? null : SCREENSHOT_BACKGROUND,
                            useCORS: true,
                            logging: false,
                            allowTaint: true,
                            scrollY: 0,
                            scrollX: 0,
                            width: captureWidth,
                            height: captureHeight,
                            windowWidth: captureWidth,
                            windowHeight: captureHeight
                        });
                    } catch (err) {
                        console.error('Screenshot export failed:', err);
                        window.alert('The screenshot could not be downloaded. Please try again.');
                    } finally {

                const fridayIndex = 4;

                                                                    {isMasterEditing && (
                                                                        <div data-master-screenshot-ignore="true" className="flex items-center gap-1">
                                                                            <button onClick={() => startEditingMasterItem(item)} className="text-slate-400 hover:text-indigo-400 hover:bg-indigo-900/30 p-1.5 rounded transition-colors cursor-pointer" title="Edit"><Edit3 className="w-4 h-4" /></button>
                                                                            <button onClick={() => removeMasterListItem(item.id)} className="text-slate-500 hover:text-rose-400 hover:bg-rose-900/30 p-1.5 rounded transition-colors cursor-pointer" title="Delete"><Trash2 className="w-4 h-4" /></button>
                                                                        </div>
                                                                    )}
                                                                </>
                                                            )}
                                                        </>
                                                    )}
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {masterActiveTab === 'contractors' && (
                                        <div className="mt-8 relative overflow-hidden bg-slate-900 border border-slate-700/60 rounded-2xl p-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 shadow-2xl">
                                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-slate-500 to-transparent opacity-40"></div>
                                            
                                            <div className="flex items-center gap-4 z-10">
                                                <div className="flex items-center justify-center">
                                                    <Truck className="w-10 h-10 text-slate-200" />
                                                </div>
                                                <div>
                                                    <h3 className="text-xl font-black text-white tracking-tight">Network Fleet Status</h3>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Aggregated Contractor Capacity</p>
                                                </div>
                                            </div>
                                            
                                            <div className="flex flex-wrap lg:flex-nowrap bg-slate-950/50 p-2 rounded-xl border border-slate-800/80 z-10 gap-1 w-full lg:w-auto">
                                                {(() => {
                                                    const fleet = masterLists.contractors || [];
                                                    const totalFleet = fleet.reduce((sum, c) => sum + (parseInt(c.total) || 0), 0);
                                                    const plannedFleet = fleet.reduce((sum, c) => sum + (parseInt(c.planned) || 0), 0);
                                                    const availFleet = Math.max(0, totalFleet - plannedFleet);
                                                    return (
                                                        <>
                                                            <div className="flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center">
                                                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-500 mb-1">Total Fleet</span>
                                                                <span className="text-2xl font-black text-white leading-none">{totalFleet}</span>
                                                            </div>
                                                            <div className="hidden lg:block w-px bg-slate-800 my-2"></div>
                                                            <div className="flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center bg-slate-800/60 border border-slate-600/40">
                                                                <span className="text-[9px] font-black uppercase tracking-widest text-slate-400 mb-1">Assigned</span>
                                                                <span className="text-2xl font-black text-slate-200 leading-none">{plannedFleet}</span>
                                                            </div>
                                                            <div className="hidden lg:block w-px bg-slate-800 my-2"></div>
                                                            <div className={`flex-1 lg:flex-none px-6 py-3 rounded-lg flex flex-col items-center justify-center border ${availFleet > 0 ? 'bg-emerald-900/10 border-emerald-500/10' : 'bg-rose-900/10 border-rose-500/10'}`}>
                                                                <span className={`text-[9px] font-black uppercase tracking-widest mb-1 ${availFleet > 0 ? 'text-emerald-500' : 'text-rose-500'}`}>Standby</span>
                                                                <span className={`text-2xl font-black leading-none ${availFleet > 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{availFleet}</span>
                                                            </div>
                                                        </>
                                                    );
                                                })()}
                                            </div>
                                        </div>
                                    )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {isAdminUser && recordToDelete && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex items-center gap-3 text-rose-400 mb-4"><AlertTriangle className="w-6 h-6" /><h3 className="text-lg font-black">Confirm Deletion</h3></div>
                                <p className="text-sm text-slate-300 mb-6">Are you sure you want to delete the data for <span className="font-bold text-white">{recordToDelete}</span>? This action cannot be undone.</p>
                                <div className="flex gap-3 justify-end">
                                    <button onClick={() => setRecordToDelete(null)} className="px-4 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors cursor-pointer">Cancel</button>
                                    <button onClick={async () => { if(!db || !isAdminUser) return; await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'dailyRecaps', recordToDelete)); setRecordToDelete(null); if(activeDate === recordToDelete) setData(DEFAULT_DATA); }} className="px-4 py-2 rounded-lg font-bold text-sm bg-rose-600 text-white hover:bg-rose-500 transition-colors shadow-lg shadow-rose-900/40 cursor-pointer">Delete Record</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
